      color: mixHex(C.BLUE, C.INK, 0.66), rim: C.ORANGE_LT, alpha: rev
    });
    glow(CX - 560, 640, 300, C.ORANGE, 0.10 * rev);
  });

  // rangees de participants (3 plans de profondeur)
  layer(function () {
    pushCam(cam, 0.66);
    crowdRow({ x0: CX - 760, step: 172, n: 10, y: 858, h: 152, t: t, seed: 3,
               color: mixHex(C.BLUE, C.INK, 0.34), rim: C.BLUE_PALE, rimStrength: 0.42, alpha: rev });
  });
  layer(function () {
    pushCam(cam, 0.84);
    crowdRow({ x0: CX - 880, step: 206, n: 10, y: 962, h: 186, t: t * 1.07, seed: 17,
               color: mixHex(C.BLUE, C.INK, 0.58), rim: C.BLUE_LT, rimStrength: 0.55, alpha: rev });
  });
  layer(function () {
    pushCam(cam, 1.06);
    crowdRow({ x0: CX - 1010, step: 258, n: 10, y: 1104, h: 240, t: t * 0.93, seed: 29,
               color: mixHex(C.BLUE, C.INK, 0.80), rim: C.ORANGE_LT, rimStrength: 0.50, alpha: rev });
  });

  // premier plan : dossiers de chaises (strates d'alpha = profondeur de champ)
  layer(function () {
    pushCam(cam, 1.26);
    for (var k = 0; k < 3; k++) {
      var a = 0.26 - k * 0.07;
      for (var i = -3; i <= 3; i++) {
        chairBack(CX + i * 330 + 150 + k * 2, H + 40 + k * 2, 210, 190,
                  mixHex(C.INK, C.BLUE, 0.08), a * rev);
      }
    }
  });

  floorSheen(1000, C.BLUE_LT, 0.05);
  veilTop(430, 0.72);
  veilBottom(230, 0.40);
  vignette(0.58, CX, 520);

  // --- typographie ---
  labelTrack('MAISON DE L’ENTREPRISE DU NIGER', CX, 150, 30, t, 5.05,
             { color: C.ORANGE, tracking: 0.24, outT0: 8.95, outDur: 0.35, shadow: true });
  titleAt('JEUDI DE L’ENTREPRENEUR', CX, 282, 96, t, 5.90, 0.50,
          { tracking: 1.5, outT0: 9.02, outDur: 0.42 });
  accentRule(CX, 318, 560, 6, t, 6.92, { origin: 'center', dur: 0.6, outT0: 9.00, outDur: 0.3 });
  bodyLine('Le rendez-vous des entrepreneurs', CX, 384, 46, t, 7.08,
           { color: rgba(C.WHITE, 0.90), outT0: 9.00, outDur: 0.35 });

  grain(t);
  return screenRect;
}

/* ==========================================================================
 *  SCENE 3 — QU'EST-CE QUE LE JDE ?  (9.60 -> 15.60)
 *  Travelling lateral continu a travers 4 tableaux d'un meme espace.
 * ======================================================================== */

var S3_TAB = 1700; // ecart entre tableaux (px monde)

function drawScene3(t) {
  var cam = newCam();
  // amorce des 9.30 : recouvrement declare avec la sortie d'ecran de la scene 2
  cam.x = track(t, [
    [9.30, -60, 'easeOutCubic'], [9.60, 0], [10.68, 130, 'easeInOutSine'],
    [11.26, S3_TAB, 'easeInOutCubic'], [11.92, S3_TAB + 120, 'easeInOutSine'],
    [12.46, S3_TAB * 2, 'easeInOutCubic'], [13.04, S3_TAB * 2 + 120, 'easeInOutSine'],
    [13.58, S3_TAB * 3, 'easeInOutCubic'], [15.60, S3_TAB * 3 + 210, 'easeInOutSine']
  ]);
  cam.y = track(t, [[9.30, 18], [9.60, 0], [11.26, -22], [12.46, 16], [13.58, -10], [15.60, -26]]);
  cam.zoom = track(t, [[9.30, 1.12, 'easeOutCubic'], [9.60, 1.02], [11.26, 1.00], [12.46, 1.03], [13.58, 1.00],
                       [15.20, 1.04, 'easeInOutSine'], [15.60, 1.22, 'easeInQuad']]);

  bgDeep(0.01);

  // lueurs d'ambiance par tableau
  layer(function () {
    pushCam(cam, 0.20);
    glow(CX, 500, 820, C.BLUE_LT, 0.20);
    glow(CX + S3_TAB, 520, 760, C.ORANGE, 0.14);
    glow(CX + S3_TAB * 2, 540, 780, C.BLUE_LT, 0.18);
    glow(CX + S3_TAB * 3, 520, 820, C.ORANGE, 0.15);
    ctx.globalAlpha = 0.35;
    for (var i = 0; i < 26; i++) {
      ctx.fillStyle = rgba(C.BLUE, i % 2 ? 0.14 : 0.07);
      rr(i * 480 - 1200, 40, 380, 980, 12); ctx.fill();
    }
  });
  layer(function () {
    pushCam(cam, 0.34);
    dustMotes(t, 44, CX + S3_TAB * 1.5, 520, 6200, C.BLUE_PALE, 0.18);
  });

  // --- strate de fiches de donnees en suspension : donne de la matiere
  //     a l'espace traverse et porte le parallax (depth 0.52) ---
  layer(function () {
    pushCam(cam, 0.52);
    for (var i = 0; i < 16; i++) {
      var wx = -200 + i * 500 + hash2(i, 31) * 180;
      var wy = 150 + hash2(i, 37) * 300 + Math.sin(t * 0.4 + i) * 10;
      var cw = 170 + hash2(i, 41) * 150, ch = 96 + hash2(i, 43) * 64;
      ctx.globalAlpha = 0.5 + hash2(i, 47) * 0.3;
      ctx.fillStyle = rgba(C.BLUE_LT, 0.10);
      rr(wx, wy, cw, ch, 12); ctx.fill();
      ctx.strokeStyle = rgba(C.BLUE_PALE, 0.16); ctx.lineWidth = 1.6;
      rr(wx, wy, cw, ch, 12); ctx.stroke();
      ctx.fillStyle = rgba(i % 3 === 0 ? C.ORANGE : C.BLUE_PALE, 0.30);
      rr(wx + 18, wy + 20, cw * 0.40, 8, 4); ctx.fill();
      ctx.fillStyle = rgba(C.BLUE_PALE, 0.18);
      rr(wx + 18, wy + 44, cw * 0.66, 6, 3); ctx.fill();
      rr(wx + 18, wy + 60, cw * 0.48, 6, 3); ctx.fill();
    }
  });

  /* ---------------- Tableau A — l'expert presente ---------------- */
  layer(function () {
    pushCam(cam, 1.0);
    var pA = seg(t, 9.34, 0.8, 'easeOutQuart');
    // panneau de donnees
    layer(function () {
      ctx.globalAlpha = pA;
      ctx.translate(CX + 250, 420 - (1 - pA) * 40);
      softShadow('#000510', 50, 20, 0.55);
      ctx.fillStyle = mixHex(C.BLUE, C.INK, 0.42);
      rr(-390, -250, 780, 500, 14); ctx.fill();
      noShadow();
      ctx.fillStyle = mixHex(C.INK, C.BLUE, 0.52);
      rr(-368, -228, 736, 456, 8); ctx.fill();
      ctx.strokeStyle = rgba(C.BLUE_PALE, 0.22); ctx.lineWidth = 2;
      rr(-368, -228, 736, 456, 8); ctx.stroke();
      ctx.fillStyle = rgba(C.WHITE, 0.88); rr(-330, -192, 280, 16, 8); ctx.fill();
      ctx.fillStyle = rgba(C.ORANGE, 0.92); rr(-330, -160, 150, 9, 4.5); ctx.fill();
    });
    barChart({ x: CX + 110, y: 596, w: 420, h: 300, n: 6,
               prog: clamp01((t - 9.52) / 1.1), seed: 9, alpha: pA });
    lineChart({ x: CX + 480, y: 596, w: 300, h: 320, n: 6,
                prog: clamp01((t - 9.72) / 1.2), color: C.ORANGE, seed: 4, lw: 5, alpha: pA });
  });
  layer(function () {
    pushCam(cam, 1.0);
    var pA2 = seg(t, 9.40, 0.7, 'easeOutQuart');
    figureStanding({
      x: CX - 430, y: 840, h: 470,
      arm: 0.45 + 0.45 * (0.5 + 0.5 * Math.sin(t * 1.4)),
      color: mixHex(C.BLUE, C.INK, 0.08), rim: C.ORANGE_LT, alpha: pA2
    });
    // pointeur lumineux vers le panneau
    var pp = seg(t, 9.80, 0.5, 'easeOutCubic');
    if (pp > 0.01) {
      layer(function () {
        ctx.globalAlpha = pp * 0.55;
        ctx.strokeStyle = rgba(C.ORANGE, 0.8); ctx.lineWidth = 2.5;
        ctx.setLineDash([14, 12]);
        ctx.beginPath(); ctx.moveTo(CX - 330, 470); ctx.lineTo(CX - 40, 420); ctx.stroke();
      });
    }
  });

  /* ---------------- Tableau B — la question ---------------- */
  layer(function () {
    pushCam(cam, 1.0);
    var pB = seg(t, 10.80, 0.8, 'easeOutQuart');
    var raise = seg(t, 11.02, 0.7, 'elasticOut');
    // cercle d'attention
    var ca = seg(t, 11.10, 0.9, 'easeOutCubic');
    if (ca > 0.01) {
      layer(function () {
        ctx.globalAlpha = ca * 0.85;
        ctx.strokeStyle = rgba(C.ORANGE, 0.75); ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(CX + S3_TAB + 10, 600, 300 * easeOutCubic(ca), 0, 6.2832); ctx.stroke();
        glow(CX + S3_TAB + 10, 600, 340 * ca, C.ORANGE, 0.18 * ca);
      });
      ripples(CX + S3_TAB + 10, 600, clamp01((t - 11.2) / 1.4), C.ORANGE, 3, 470);
    }
    // voisins
    figureAudience({ x: CX + S3_TAB - 420, y: 800, h: 330, color: mixHex(C.BLUE, C.INK, 0.40),
                     rim: C.BLUE_LT, turn: 0.4, lean: 0.3, alpha: pB });
    figureAudience({ x: CX + S3_TAB + 440, y: 800, h: 330, color: mixHex(C.BLUE, C.INK, 0.40),
                     rim: C.BLUE_LT, turn: -0.45, lean: 0.2, alpha: pB });
    figureRaisedHand({ x: CX + S3_TAB + 10, y: 812, h: 400, raise: raise,
                       color: mixHex(C.BLUE, C.INK, 0.08), rim: C.ORANGE_LT, alpha: pB });
    speechBubble({ x: CX + S3_TAB + 300, y: 360, w: 300, h: 134,
                   prog: clamp01((t - 11.30) / 0.5), flip: false });
  });

  /* ---------------- Tableau C — la prise de notes ---------------- */
  layer(function () {
    pushCam(cam, 1.0);
    var pC = seg(t, 12.00, 0.8, 'easeOutQuart');
    layer(function () {
      ctx.globalAlpha = pC;
      // plan de table
      var g = ctx.createLinearGradient(0, 700, 0, 1080);
      g.addColorStop(0, mixHex(C.BLUE, C.INK, 0.50));
      g.addColorStop(1, mixHex(C.INK, C.BLUE, 0.10));
      ctx.fillStyle = g;
      poly([[CX + S3_TAB * 2 - 1020, 1080], [CX + S3_TAB * 2 - 790, 620],
            [CX + S3_TAB * 2 + 790, 620], [CX + S3_TAB * 2 + 1020, 1080]]);
      ctx.fill();
      ctx.strokeStyle = rgba(C.ORANGE_LT, 0.30); ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(CX + S3_TAB * 2 - 790, 620); ctx.lineTo(CX + S3_TAB * 2 + 790, 620); ctx.stroke();
    });
    notebook({ x: CX + S3_TAB * 2 - 330, y: 790, w: 440, h: 310, rot: -0.09,
               prog: clamp01((t - 12.10) / 1.5), lines: 6, alpha: pC });
    notebook({ x: CX + S3_TAB * 2 + 320, y: 812, w: 400, h: 285, rot: 0.11,
               prog: clamp01((t - 12.32) / 1.5), lines: 5, alpha: pC });
    // stylos
    layer(function () {
      ctx.globalAlpha = pC * 0.95;
      ctx.strokeStyle = C.ORANGE; ctx.lineWidth = 11; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(CX + S3_TAB * 2 - 150, 710); ctx.lineTo(CX + S3_TAB * 2 - 70, 610); ctx.stroke();
      ctx.strokeStyle = rgba(C.BLUE_PALE, 0.8); ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.moveTo(CX + S3_TAB * 2 + 470, 716); ctx.lineTo(CX + S3_TAB * 2 + 560, 632); ctx.stroke();
    });
    figureAudience({ x: CX + S3_TAB * 2 - 340, y: 606, h: 350,
                     color: mixHex(C.BLUE, C.INK, 0.22), rim: C.BLUE_LT,
                     turn: 0.25, lean: 0.75 + 0.25 * Math.sin(t * 1.6), alpha: pC });
    figureAudience({ x: CX + S3_TAB * 2 + 330, y: 606, h: 350,
                     color: mixHex(C.BLUE, C.INK, 0.22), rim: C.ORANGE_LT,
                     turn: -0.25, lean: 0.70 + 0.25 * Math.sin(t * 1.6 + 1.4), alpha: pC });
  });

  /* ---------------- Tableau D — networking ---------------- */
  layer(function () {
    pushCam(cam, 1.0);
    var pD = seg(t, 13.10, 0.8, 'easeOutQuart');
    var shake = seg(t, 13.42, 0.6, 'elasticOut');
    layer(function () {
      ctx.globalAlpha = pD;
      figurePair({ x: CX + S3_TAB * 3, y: 846, h: 500, shake: shake,
                   c1: mixHex(C.BLUE, C.INK, 0.10),
                   c2: mixHex(C.BLUE, C.SLATE, 0.45) });
    });
    speechBubble({ x: CX + S3_TAB * 3 - 360, y: 350, w: 310, h: 138,
                   prog: clamp01((t - 13.55) / 0.5), flip: true, alpha: pD });
    speechBubble({ x: CX + S3_TAB * 3 + 370, y: 430, w: 280, h: 124,
                   prog: clamp01((t - 13.78) / 0.5), flip: false, alpha: pD });
    // cartes de visite qui s'echangent
    for (var i = 0; i < 3; i++) {
      var cp = clamp01((t - 14.05 - i * 0.12) / 0.9);
      if (cp <= 0.001) continue;
      var k = easeOutCubic(cp);
      businessCard(CX + S3_TAB * 3 + lerp(-120, 170, k) + i * 14,
                   640 - Math.sin(k * Math.PI) * 130 + i * 8,
                   130, lerp(-0.5, 0.42, k) + i * 0.1,
                   pD * Math.min(1, cp * 2.2) * (1 - clamp01((cp - 0.82) / 0.18)));
    }
    // petites figures autour
    figureAudience({ x: CX + S3_TAB * 3 - 700, y: 812, h: 320, color: mixHex(C.BLUE, C.INK, 0.62),
                     rim: C.BLUE_LT, turn: 0.5, alpha: pD * 0.85 });
    figureAudience({ x: CX + S3_TAB * 3 + 720, y: 830, h: 330, color: mixHex(C.BLUE, C.INK, 0.62),
                     rim: C.BLUE_LT, turn: -0.5, alpha: pD * 0.85 });
  });

  floorSheen(1010, C.BLUE_LT, 0.045);
  veilTop(300, 0.52);
  veilBottom(540, 0.90);
  vignette(0.60, CX, 520);

  // --- mots-cles cinetiques (espace ecran, pendant les temps de pause) ---
  kineticWord('APPRENEZ', CX, 980, 118, t, 10.15, 0.92, { tracking: 4 });
  kineticWord('ÉCHANGEZ', CX, 980, 118, t, 11.35, 0.90, { tracking: 4 });
  kineticWord('AGISSEZ',  CX, 980, 118, t, 12.55, 0.88, { tracking: 4 });

  // --- phrase de synthese (3 segments, stagger 0.22 s) ---
  var ph = [
    'Des connaissances pratiques.',
    'Des échanges.',
    'Des opportunités.'
  ];
  for (var i = 0; i < 3; i++) {
    bodyLine(ph[i], 170, 796 + i * 72, 46, t, 13.58 + i * 0.22,
             { align: 'left', color: i === 2 ? C.ORANGE_LT : C.WHITE,
               weight: i === 2 ? 700 : 500, outT0: 15.26, outDur: 0.3 });
  }
  accentRule(170, 716, 190, 6, t, 13.50, { origin: 'left', dur: 0.5, outT0: 15.26 });

  grain(t);
}


/* ======================= src/07-scenes-456.js ======================= */
/* ============================================================================
 *  07 — SCENES 4 a 6
 * ========================================================================== */

/* ==========================================================================
 *  SCENE 4 — LES THEMATIQUES  (15.60 -> 21.60)
 *  Travelling horizontal continu dans un univers clair. Sept stations.
 * ======================================================================== */

var S4_GAP = 820;
var S4_STATIONS = [
  { word: 'FISCALITÉ',     obj: objForms,     oy: 455, above: false, s: 1.62 },
  { word: 'FINANCEMENT',   obj: objCoins,     oy: 620, above: true,  s: 1.55 },
  { word: 'GESTION',       obj: objDashboard, oy: 450, above: false, s: 1.50 },
  { word: 'MARKETING',     obj: objTarget,    oy: 455, above: false, s: 1.28 },
  { word: 'COMMERCE',      obj: objShop,      oy: 540, above: true,  s: 1.50 },
  { word: 'DIGITAL',       obj: objScreenNet, oy: 450, above: false, s: 1.46 },
  { word: 'DÉVELOPPEMENT', obj: objStairs,    oy: 560, above: true,  s: 1.42 }
];
var S4_T0 = [15.88, 16.65, 17.35, 18.05, 18.75, 19.45, 20.15];

/** Position ecran d'un point monde sous une camera donnee. */
function worldToScreen(cam, depth, wx, wy) {
  var d = depth === undefined ? 1 : depth;
  var z = 1 + (cam.zoom - 1) * d;
  return [CX + z * (wx - CX - cam.x * d), CY + z * (wy - CY - cam.y * d)];
}

function drawScene4(t) {
  var cam = newCam();
  cam.x = track(t, [
    [15.60, -170, 'easeInOutSine'], [15.95, 0, 'easeOutCubic'],
    [16.65, S4_GAP, 'linear'],     [17.35, S4_GAP * 2, 'linear'],
    [18.05, S4_GAP * 3, 'linear'], [18.75, S4_GAP * 4, 'linear'],
    [19.45, S4_GAP * 5, 'linear'], [20.15, S4_GAP * 6, 'easeInOutSine'],
    [20.85, S4_GAP * 6 + 120, 'easeInOutSine'], [21.60, S4_GAP * 6 + 160]
  ]);
  cam.y = track(t, [
    [15.60, 10], [16.65, -42], [17.35, 34], [18.05, -30],
    [18.75, 40], [19.45, -24], [20.15, 18],
    [20.85, -40, 'easeInOutQuint'], [21.35, -150, 'easeInOutQuint'], [21.60, -170]
  ]);
  cam.zoom = track(t, [
    [15.60, 1.06, 'easeOutCubic'], [15.95, 1.00], [20.15, 1.00],
    [20.85, 0.94, 'easeInOutQuint'], [21.35, 0.70, 'easeInOutQuint'], [21.60, 0.66]
  ]);

  var gridP = seg(t, 20.85, 0.52, 'easeInOutQuint');     // morph vers la grille
  var darken = seg(t, 21.12, 0.46, 'easeInOutCubic');    // retour a la nuit

  bgPaper();

  // --- decor de fond : bandes et horizon ---
  layer(function () {
    pushCam(cam, 0.22);
    ctx.globalAlpha = 0.9;
    var g = ctx.createLinearGradient(0, 600, 0, 1080);
    g.addColorStop(0, rgba(C.BLUE, 0.00));
    g.addColorStop(1, rgba(C.BLUE, 0.20));
    ctx.fillStyle = g; ctx.fillRect(-2000, 600, 12000, 480);
    for (var i = 0; i < 9; i++) {
      ctx.fillStyle = rgba(C.BLUE_LT, i % 2 ? 0.085 : 0.040);
      rr(CX + i * S4_GAP - 660, 90, 520, 830, 28); ctx.fill();
    }
  });

  // --- ligne d'horizon / sol ---
  layer(function () {
    pushCam(cam, 1.0);
    ctx.strokeStyle = rgba(C.BLUE, 0.16); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-3000, 886); ctx.lineTo(14000, 886); ctx.stroke();
  });

  // --- stations : objet + mot ancre dans la scene ---
  for (var i = 0; i < 7; i++) {
    var st = S4_STATIONS[i];
    var wx = CX + i * S4_GAP;
    var t0 = S4_T0[i];
    var prog = clamp01((t - (t0 - (i === 0 ? 0.96 : 0.60))) / 1.15);
    var fade = 1 - clamp01((t - (t0 + 1.95)) / 0.55);   // les stations passees s'effacent
    if (i === 6) fade = 1;
    var alpha = Math.min(1, prog * 2.2) * fade * (1 - gridP * 0.92);
    if (alpha <= 0.004) continue;

    // objet (precede de son disque d'ancrage, verrouille a la meme profondeur)
    (function (st, wx, prog, alpha, idx) {
      layer(function () {
        pushCam(cam, 1.0);
        ctx.globalAlpha = alpha;
        layer(function () {
          var dp = easeOutCubic(clamp01(prog * 1.5));
          ctx.globalAlpha = alpha * 0.9;
          var g = ctx.createRadialGradient(wx, st.oy, 0, wx, st.oy, 420 * dp);
          g.addColorStop(0, rgba(idx % 2 ? C.ORANGE : C.BLUE_LT, 0.16));
          g.addColorStop(0.68, rgba(idx % 2 ? C.ORANGE : C.BLUE_LT, 0.07));
          g.addColorStop(1, rgba(idx % 2 ? C.ORANGE : C.BLUE_LT, 0));
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(wx, st.oy, 420 * dp, 0, 6.2832); ctx.fill();
        });
        st.obj(wx, st.oy, st.s, prog, t);
      });
    })(st, wx, prog, alpha, i);

    // mot integre a la scene (soumis au parallax, donc ancre a l'objet).
    // Des que le morph vers la grille demarre, c'est le mot de la grille qui
    // prend le relais depuis cette meme position : on ne dessine pas les deux.
    var wy = st.above ? st.oy - 185 * st.s - 104 : st.oy + 185 * st.s + 186;
    if (gridP > 0.001) continue;
    (function (st, wx, wy, t0, alpha) {
      layer(function () {
        pushCam(cam, 1.0);
        ctx.globalAlpha = alpha;
        titleAt(st.word, wx, wy, 86, t, t0 - 0.22, 0.46,
                { color: C.BLUE, tracking: 1.5, shadow: false, step: 0.05 });
        accentRule(wx, wy + 30, 190, 7, t, t0 - 0.02, { origin: 'center', dur: 0.45 });
      });
    })(st, wx, wy, t0, alpha);
  }

  // --- morph : les sept mots se reorganisent en grille vue de dessus ---
  if (gridP > 0.004) {
    var slots = [
      [CX - 540, 430], [CX, 430], [CX + 540, 430],
      [CX - 540, 580], [CX, 580], [CX + 540, 580],
      [CX, 730]
    ];
    for (var i2 = 0; i2 < 7; i2++) {
      var st2 = S4_STATIONS[i2];
      var wx2 = CX + i2 * S4_GAP;
      var wy2 = st2.above ? st2.oy - 185 * st2.s - 104 : st2.oy + 185 * st2.s + 186;
      var from = worldToScreen(cam, 1.0, wx2, wy2);
      var k = easeInOutQuint(clamp01((gridP - i2 * 0.018) / (1 - 6 * 0.018)));
      var px = lerp(from[0], slots[i2][0], k);
      var py = lerp(from[1], slots[i2][1], k);
      var sz = lerp(86, 50, k);
      (function (st2, px, py, sz, k) {
        layer(function () {
          ctx.globalAlpha = Math.min(1, gridP * 2.4) * (1 - darken * 0.25);
          ctx.font = FT.display(sz, 900);
          ctx.textBaseline = 'alphabetic';
          ctx.fillStyle = mixHex(C.BLUE, C.WHITE, darken);
          drawTracked(st2.word, px, py, 1.4, 'center');
          ctx.fillStyle = rgba(C.ORANGE, 0.95);
          var uw = trackedWidth(st2.word, 1.4);
          rr(px - uw / 2, py + sz * 0.26, uw * k, 4, 2); ctx.fill();
        });
      })(st2, px, py, sz, k);
    }
    labelTrack('LES THÉMATIQUES DU JDE', CX, 232, 32, t, 21.26,
               { color: C.ORANGE, tracking: 0.24, dur: 0.45 });
  }

  vignette(0.30, CX, 520);

  // --- retour a la nuit institutionnelle ---
  if (darken > 0.002) {
    layer(function () {
      ctx.globalAlpha = darken;
      var g = ctx.createRadialGradient(CX, 540, 120, CX, 540, 1250);
      g.addColorStop(0, rgba(C.INK_2, 0.94));
      g.addColorStop(1, C.INK);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    });
  }

  grain(t, 0.026);
}

/* ==========================================================================
 *  SCENE 5 — LA COMMUNAUTE  (21.60 -> 26.00)
 * ======================================================================== */

var S5_N = 14;
var S5_CX = CX, S5_CY = 600;

/** Position d'une silhouette de la communaute a l'instant t. */
function s5Pos(i, t) {
  var a = (i / S5_N) * 6.2832 - 1.35;
  var rx = 560, ry = 300;
  var pin = stagger(t, 21.62, i, 0.70, 'easeOutQuint', 0.045);
  var conv = seg(t, 23.30, 0.75, 'easeInOutQuint');
  var sink = seg(t, 25.05, 0.95, 'easeInOutQuint');
  var rad = lerp(1.78, 1.0, pin) * lerp(1.0, 0.74, conv) * lerp(1, 0.06, sink);
  var breathe = 1 + 0.018 * Math.sin(t * 1.1 + i * 0.7);
  return {
    x: S5_CX + Math.cos(a) * rx * rad * breathe,
    y: S5_CY + Math.sin(a) * ry * rad * breathe,
    pin: pin, conv: conv, sink: sink, a: a
  };
}

function drawScene5(t) {
  var cam = newCam();
  cam.zoom = track(t, [[21.60, 1.08, 'easeOutCubic'], [23.30, 1.00],
                       [25.05, 1.02], [26.00, 1.14, 'easeInOutQuint']]);
  cam.y = track(t, [[21.60, 20], [23.30, 0], [26.00, -14]]);

  bgDeep(0.015);
  layer(function () {
    pushCam(cam, 0.20);
    glow(S5_CX, S5_CY, 1020, C.BLUE_LT, 0.20);
    glow(S5_CX, S5_CY, 420, C.ORANGE, 0.10);
  });
  layer(function () {
    pushCam(cam, 0.34);
    dustMotes(t, 52, S5_CX, S5_CY, 1800, C.BLUE_PALE, 0.22);
  });

  // positions
  var pts = [], i;
  for (i = 0; i < S5_N; i++) pts.push(s5Pos(i, t));

  // --- lignes de connexion (graphe de reseau) ---
  var netNodes = [], edges = [];
  for (i = 0; i < S5_N; i++) netNodes.push([pts[i].x, pts[i].y - 26]);
  for (i = 0; i < S5_N; i++) edges.push([i, (i + 1) % S5_N]);
  for (i = 0; i < S5_N; i += 2) edges.push([i, (i + 5) % S5_N]);
  for (i = 1; i < S5_N; i += 4) edges.push([i, (i + 7) % S5_N]);
  layer(function () {
    pushCam(cam, 0.92);
    networkGraph({
      nodes: netNodes, edges: edges,
      prog: clamp01((t - 22.80) / 1.9),
      edgeColor: C.ORANGE, edgeAlpha: 0.42,
      nodeColor: rgba(C.ORANGE_LT, 0.9), nodeGlow: C.ORANGE, r: 4.5,
      lw: 2.2, alpha: 1 - seg(t, 25.05, 0.7, 'easeInCubic')
    });
  });

  // --- anneau central ---
  layer(function () {
    pushCam(cam, 0.88);
    ringOrbit({
      x: S5_CX, y: S5_CY, r: 210 * (1 - seg(t, 25.05, 0.9, 'easeInOutQuint') * 0.94),
      prog: seg(t, 23.30, 1.1, 'easeInOutCubic'), t: t,
      alpha: 1 - seg(t, 25.50, 0.5, 'easeInCubic')
    });
  });

  // --- silhouettes ---
  for (i = 0; i < S5_N; i++) {
    var p = pts[i];
    if (p.pin <= 0.003) continue;
    var tone = i % 5;
    var col = tone === 0 ? C.BLUE_LT
            : tone === 1 ? mixHex(C.BLUE, C.BLUE_LT, 0.55)
            : tone === 2 ? mixHex(C.BLUE_LT, C.WHITE, 0.30)
            : tone === 3 ? mixHex(C.BLUE, C.SAND, 0.26)
            : mixHex(C.BLUE, C.BLUE_LT, 0.25);
    var hh = 112 + hash1(i) * 46;
    var depth = 0.78 + (p.y - S5_CY) / 900;
    (function (p, col, hh, depth, i) {
      layer(function () {
        pushCam(cam, depth);
        figureIcon({
          x: p.x, y: p.y, h: hh * lerp(0.6, 1, p.pin) * lerp(1, 0.4, p.sink),
          color: col, rim: i % 3 === 0 ? C.ORANGE_LT : null,
          glowA: 0.10 + 0.14 * p.conv, glowC: i % 3 === 0 ? C.ORANGE : C.BLUE_LT,
          alpha: Math.min(1, p.pin * 1.4) * (1 - p.sink * 0.65)
        });
      });
    })(p, col, hh, depth, i);
  }

  // noyau lumineux final
  var sink = seg(t, 25.05, 0.95, 'easeInOutQuint');
  if (sink > 0.01) {
    glow(S5_CX, S5_CY, lerp(40, 560, sink), C.ORANGE_LT, 0.55 * sink);
    glow(S5_CX, S5_CY, lerp(12, 190, sink), C.WHITE, 0.80 * sink);
  }

  veilTop(280, 0.50);
  veilBottom(330, 0.52);
  vignette(0.60, S5_CX, S5_CY);

  // --- typographie ---
  bulletRow(['ENTREPRENEURS', 'PORTEURS DE PROJETS', 'PROFESSIONNELS'],
            CX, 232, 40, t, 22.15,
            { step: 0.16, color: rgba(C.WHITE, 0.94), weight: 600,
              tracking: 0.11, outT0: 25.00, dur: 0.5 });

  // APPRENEZ • ECHANGEZ • AGISSEZ — trois blocs en elasticSoft,
  // positions calculees sur la chasse reelle pour un rythme regulier.
  var blocks = ['APPRENEZ', 'ÉCHANGEZ', 'AGISSEZ'];
  ctx.font = FT.display(74, 900);
  var bw = blocks.map(function (s) { return trackedWidth(s, 3); });
  var bGap = 58, bDot = 18;
  var bTot = bw[0] + bw[1] + bw[2] + 2 * (bGap * 2 + bDot);
  var bLeft = CX - bTot / 2, bx = [], bdot = [];
  for (i = 0; i < 3; i++) {
    bx.push(bLeft + bw[i] / 2);
    if (i < 2) bdot.push(bLeft + bw[i] + bGap + bDot / 2);
    bLeft += bw[i] + (i < 2 ? bGap * 2 + bDot : 0);
  }
  for (i = 0; i < 3; i++) {
    var pb = seg(t, 23.85 + i * 0.18, 0.62, function (x) { return elasticSoft(x, 0.26); });
    var ob = seg(t, 25.02 + i * 0.05, 0.34, 'easeInCubic');
    if (pb <= 0.003 || ob >= 0.997) continue;
    (function (pb, ob, cx2, txt) {
      layer(function () {
        ctx.globalAlpha = Math.min(1, pb * 1.4) * (1 - ob);
        ctx.font = FT.display(74, 900);
        ctx.textBaseline = 'alphabetic';
        softShadow('#00070F', 40, 12, 0.5);
        ctx.fillStyle = C.WHITE;
        ctx.translate(0, (1 - pb) * 46 - ob * 40);
        drawTracked(txt, cx2, 962, 3, 'center');
      });
    })(pb, ob, bx[i], blocks[i]);
    if (i < 2) {
      var pd = seg(t, 24.02 + i * 0.18, 0.4, 'easeOutCubic');
      var od = seg(t, 25.02, 0.34, 'easeInCubic');
      if (pd > 0.003 && od < 0.997) {
        (function (pd, od, x) {
          layer(function () {
            ctx.globalAlpha = pd * (1 - od);
            ctx.fillStyle = C.ORANGE;
            ctx.beginPath(); ctx.arc(x, 938, 9 * pd, 0, 6.2832); ctx.fill();
          });
        })(pd, od, bdot[i]);
      }
    }
  }

  grain(t);
}

/* ==========================================================================
 *  SCENE 6 — END CARD  (26.00 -> 30.00)
 *  Image gelee a partir de 29.70 (capture reseau social).
 * ======================================================================== */

var S6_FREEZE = 29.70;

function drawScene6(tAbs) {
  var t = Math.min(tAbs, S6_FREEZE);   // gel total de la derniere seconde

  var cam = newCam();
  cam.zoom = track(t, [[26.00, 1.05, 'easeOutQuart'], [27.00, 1.00], [29.70, 1.00]]);

  bgDeep(0.01);

  // halo issu du point lumineux de la scene 5
  var bloom = 1 - seg(t, 26.00, 0.85, 'easeOutQuart');
  layer(function () {
    pushCam(cam, 0.22);
    glow(CX, 520, 1080, C.BLUE_LT, 0.20);
    glow(CX, 470, 520, C.ORANGE, 0.085);
    if (bloom > 0.002) {
      // prolonge exactement le noyau lumineux sur lequel la scene 5 se referme
      glow(CX, 600, lerp(300, 1150, 1 - bloom), C.ORANGE_LT, 0.70 * bloom);
      glow(CX, 600, lerp(190, 620, 1 - bloom), C.WHITE, 0.92 * bloom);
    }
  });
  layer(function () {
    pushCam(cam, 0.36);
    dustMotes(t, 34, CX, 520, 1600, C.BLUE_PALE, 0.16);
  });

  // particules d'accent qui se posent puis s'immobilisent
  for (var i = 0; i < 18; i++) {
    var pp = seg(t, 29.05 + i * 0.012, 0.55, 'easeOutQuart');
    var pa = seg(t, 26.55 + i * 0.03, 0.7, 'easeOutCubic');
    if (pa <= 0.004) continue;
    var a0 = hash1(i) * 6.2832;
    var rr0 = 420 + hash2(i, 3) * 420;
    var settle = pp;
    var x = CX + Math.cos(a0) * rr0 * lerp(1.25, 1.0, pa);
    var y = 540 + Math.sin(a0) * rr0 * 0.46 * lerp(1.25, 1.0, pa);
    var drift = (1 - settle) * Math.sin(t * 0.9 + i) * 9;
    layer(function () {
      ctx.globalAlpha = (0.30 + 0.45 * hash2(i, 7)) * pa;
      ctx.fillStyle = i % 4 === 0 ? C.ORANGE : C.BLUE_PALE;
      ctx.beginPath();
      ctx.arc(x + drift, y + drift * 0.6, 1.6 + hash2(i, 9) * 2.4, 0, 6.2832);
      ctx.fill();
    });
  }

  vignette(0.66, CX, 500);
  endCardFrame(seg(t, 26.05, 1.15, 'easeInOutCubic'), 56, rgba(C.BLUE_PALE, 0.40), 0.75);

  // --- marque officielle ---
  logoMEN(CX, 352, 520, 190, seg(t, 26.20, 0.85, 'linear'), 1);

  // --- titre et signature ---
  titleAt('JEUDI DE L’ENTREPRENEUR', CX, 612, 92, t, 26.90, 0.52, { tracking: 1.6 });
  accentRule(CX, 652, 540, 7, t, 27.65, { origin: 'center', dur: 0.6 });
  bodyLine('Chaque dernier jeudi du mois', CX, 742, 48, t, 27.78,
           { color: rgba(C.WHITE, 0.92), weight: 500 });
  bodyLine('Rejoignez-nous.', CX, 846, 56, t, 28.45,
           { color: C.ORANGE_LT, weight: 700 });
  // La raison sociale n'est rappelee en pied que si le lockup de substitution
  // n'est pas a l'image (sinon elle y figure deja).
  labelTrack(LOGO.missing ? 'NIAMEY · NIGER' : 'MAISON DE L’ENTREPRISE DU NIGER',
             CX, 958, 28, t, 28.85,
             { color: rgba(C.BLUE_PALE, 0.72), tracking: 0.26, dur: 0.6 });

  grain(t);
}


/* ======================= src/08-seek.js ======================= */
/* ============================================================================
 *  08 — DISPATCHER, TRANSITIONS INTER-SCENES ET POINT D'ENTREE
 *  window.seek(t) est l'unique fonction de rendu. Pour un meme t, l'image
 *  produite est strictement identique quel que soit l'ordre des appels.
 * ========================================================================== */

/* Fenetres de transition declarees (CLOCK.md §1) */
var TR = {
  wipe12:   { t0: 4.45,  t1: 4.95,  cut: 4.80 },   // lame orange diagonale
  portal23: { t0: 9.30,  t1: 9.60,  cut: 9.60 },   // sortie d'ecran (dissolve)
  flash34:  { t0: 15.44, t1: 15.78, cut: 15.60 },  // zoom-cut + flash
  fade45:   { t0: 21.42, t1: 21.60, cut: 21.60 }   // bascule vers la nuit
};

/** Compose une scene via le tampon hors-ecran, puis la depose avec alpha. */
function overlayScene(drawFn, t, alpha) {
  if (alpha <= 0.002) return;
  withOffscreen(function () { drawFn(t); });
  layer(function () {
    ctx.globalAlpha = Math.min(1, alpha);
    ctx.drawImage(OFF, 0, 0);
  });
}

function renderAt(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  noShadow();

  /* ---------------- SCENE 1 + wipe vers 2 ---------------- */
  if (t < TR.wipe12.t0) {
    drawScene1(t);
    return;
  }
  if (t < TR.wipe12.t1) {
    var pw = segRaw(t, TR.wipe12.t0, TR.wipe12.t1 - TR.wipe12.t0);
    var pwE = easeInOutCubic(pw);
    drawScene1(t);
    withOffscreen(function () { drawScene2(t); });
    clipDiagonal(pwE, -0.32, function () { ctx.drawImage(OFF, 0, 0); });
    wipeBlade(pwE, -0.32, C.ORANGE, 200);
    return;
  }

  /* ---------------- SCENE 2 + sortie d'ecran vers 3 ---------------- */
  if (t < TR.portal23.t0) {
    drawScene2(t);
    return;
  }
  if (t < TR.portal23.t1) {
    var pp = segRaw(t, TR.portal23.t0, TR.portal23.t1 - TR.portal23.t0);
    drawScene2(t);
    overlayScene(drawScene3, t, easeInOutCubic(pp));
    return;
  }

  /* ---------------- SCENE 3 + zoom-cut vers 4 ---------------- */
  if (t < TR.flash34.cut) {
    drawScene3(t);
    if (t >= TR.flash34.t0) {
      flash(segRaw(t, TR.flash34.t0, TR.flash34.t1 - TR.flash34.t0), C.WHITE, 0.92);
    }
    return;
  }

  /* ---------------- SCENE 4 + bascule vers 5 ---------------- */
  if (t < TR.fade45.t0) {
    drawScene4(t);
    if (t < TR.flash34.t1) {
      flash(segRaw(t, TR.flash34.t0, TR.flash34.t1 - TR.flash34.t0), C.WHITE, 0.92);
    }
    return;
  }
  if (t < TR.fade45.t1) {
    var pf = segRaw(t, TR.fade45.t0, TR.fade45.t1 - TR.fade45.t0);
    drawScene4(t);
    overlayScene(drawScene5, t, easeInOutCubic(pf));
    return;
  }

  /* ---------------- SCENE 5 ---------------- */
  if (t < TIMELINE.S6.t0) {
    drawScene5(t);
    return;
  }

  /* ---------------- SCENE 6 ---------------- */
  drawScene6(t);
}

/* ==========================================================================
 *  POINT D'ENTREE PUBLIC
 * ======================================================================== */
window.seek = function (t) {
  var tt = typeof t === 'number' && isFinite(t) ? t : 0;
  if (tt < 0) tt = 0;
  if (tt > DURATION) tt = DURATION;
  renderAt(tt);
  var hud = document.getElementById('tt');
  if (hud) hud.textContent = tt.toFixed(3);
  return tt;
};
window.seekFrame = function (i) { return window.seek(i / FPS); };
window.JDE = {
  DURATION: DURATION, FPS: FPS, W: W, H: H,
  TIMELINE: TIMELINE, TRANSITIONS: TR,
  totalFrames: Math.round(DURATION * FPS),
  logoMissing: function () { return LOGO.missing; }
};

/* ==========================================================================
 *  INITIALISATION  (polices + logo + grain) puis window.__READY__
 * ======================================================================== */
window.__READY__ = false;
window.__INIT_ERROR__ = null;

(function init() {
  buildGrain();

  var fontsReady = (document.fonts && document.fonts.ready)
    ? document.fonts.ready.then(function () {
        // force le chargement effectif des deux familles avant la premiere frame
        return Promise.all([
          document.fonts.load('900 120px Montserrat', 'ABCDEFGHIJKLMNOPQRSTUVWXYZÉÈÊ?•'),
          document.fonts.load('800 120px Montserrat', 'ABCDEFGHIJKLMNOPQRSTUVWXYZÉÈÊ'),
          document.fonts.load('700 48px Inter', 'abcdefghijklmnopqrstuvwxyzéèêà’.'),
          document.fonts.load('500 48px Inter', 'abcdefghijklmnopqrstuvwxyzéèêà’.'),
          document.fonts.load('600 40px Inter', 'ABCDEFGHIJKLMNOPQRSTUVWXYZÉ')
        ]);
      })
    : Promise.resolve();

  Promise.all([fontsReady, loadLogo()])
    .then(function () {
      window.seek(0);
      window.__READY__ = true;
      console.log('[JDE] pret — ' + window.JDE.totalFrames + ' frames a rendre.');
    })
    .catch(function (e) {
      window.__INIT_ERROR__ = String(e && e.stack || e);
      console.error('[JDE] erreur d initialisation', e);
      try { window.seek(0); } catch (e2) {}
      window.__READY__ = true;
    });
})();

/* ==========================================================================
 *  PREVIEW INTERACTIVE (navigateur uniquement)
 *  La boucle ne fait QUE calculer t depuis une horloge et appeler seek(t).
 *  Elle n'accumule aucun etat visuel et est inactive en mode rendu
 *  (body.render), ou seul Puppeteer pilote le temps.
 * ======================================================================== */
(function preview() {
  window.__RENDER__ = /[?&]render=1/.test(location.search);
  if (window.__RENDER__) {
    document.body.classList.add('render');
    return;
  }
  if (document.body.classList.contains('render')) return;

  var playing = false, anchorWall = 0, anchorT = 0, cur = 0;

  function fit() {
    var s = Math.min(window.innerWidth / W, window.innerHeight / H);
    cv.style.width = (W * s) + 'px';
    cv.style.height = (H * s) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();

  function loop() {
    if (playing) {
      var e = (performance.now() - anchorWall) / 1000;
      cur = (anchorT + e) % DURATION;
      window.seek(cur);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  document.addEventListener('keydown', function (ev) {
    if (ev.code === 'Space') {
      ev.preventDefault();
      playing = !playing;
      anchorWall = performance.now(); anchorT = cur;
    } else if (ev.code === 'ArrowRight') {
      playing = false; cur = Math.min(DURATION, cur + 1 / FPS); window.seek(cur);
    } else if (ev.code === 'ArrowLeft') {
      playing = false; cur = Math.max(0, cur - 1 / FPS); window.seek(cur);
    } else if (ev.code === 'Home') {
      playing = false; cur = 0; window.seek(0);
    } else if (ev.code === 'End') {
      playing = false; cur = DURATION - 1 / FPS; window.seek(cur);
    }
  });
})();
