<div id="stage"><canvas id="cv" width="1920" height="1080"></canvas></div>
<div id="hud">JDE · <span id="tt">0.000</span> s / 30.000 s — espace : lecture/pause · ←/→ : ±1 frame · Home/End</div>

<!-- Courbes d'inertie : fichier de configuration reutilisable -->
<script src="EASING_FUNCTIONS.js"></script>

<script>
'use strict';

/* ======================= src/01-core.js ======================= */
/* ============================================================================
 *  JDE — MOTEUR DE RENDU DETERMINISTE  ·  01 — NOYAU
 *  Point d'entree unique : window.seek(t)   (t en secondes, 0 -> 30)
 *  Contrat : RULES.md — aucune horloge, aucun accumulateur, aucun random
 *  non seede dans la logique de dessin.
 * ========================================================================== */

var W = 1920, H = 1080, FPS = 60, DURATION = 30.0;
var CX = W / 2, CY = H / 2;

var cv  = document.getElementById('cv');
var ctx = cv.getContext('2d', { alpha: false });

/* --------------------------------------------------------------------------
 * PALETTE  (LOOK.md §2)
 * ------------------------------------------------------------------------ */
var C = {
  INK:       '#061629',
  INK_2:     '#0A2440',
  BLUE:      '#0E3A6B',
  BLUE_LT:   '#1D6FB8',
  BLUE_PALE: '#7FB2DF',
  ORANGE:    '#F6871F',
  ORANGE_LT: '#FFA94D',
  WHITE:     '#FFFFFF',
  PAPER:     '#F2F6FB',
  PAPER_2:   '#DFE8F3',
  SAND:      '#E7C9A3',
  SLATE:     '#2B4A6F'
};
/** Accepte '#rgb', '#rrggbb' et 'rgb(r,g,b)' (sortie de mixHex). */
function rgba(col, a) {
  if (col.charCodeAt(0) === 114) { // 'r' -> rgb(...)
    var p = col.slice(col.indexOf('(') + 1, col.lastIndexOf(')')).split(',');
    return 'rgba(' + (+p[0] | 0) + ',' + (+p[1] | 0) + ',' + (+p[2] | 0) + ',' + a + ')';
  }
  var h = col.replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  var n = parseInt(h, 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function mixHex(h1, h2, x) {
  var a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  var r  = Math.round(lerp((a >> 16) & 255, (b >> 16) & 255, x));
  var g  = Math.round(lerp((a >> 8) & 255,  (b >> 8) & 255,  x));
  var bl = Math.round(lerp(a & 255,         b & 255,         x));
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}

/* --------------------------------------------------------------------------
 * TYPOGRAPHIE  (LOOK.md §4)
 * ------------------------------------------------------------------------ */
var FT = {
  display: function (s, w) { return (w || 900) + ' ' + s + 'px Montserrat, "Segoe UI", sans-serif'; },
  ui:      function (s, w) { return (w || 500) + ' ' + s + 'px Inter, "Segoe UI", sans-serif'; }
};

/* --------------------------------------------------------------------------
 * NOYAU : calques, camera, geometrie
 * ------------------------------------------------------------------------ */
function layer(fn) { ctx.save(); try { fn(); } finally { ctx.restore(); } }

/** Camera virtuelle 2.5D. depth : 0 = arriere-plan lointain, 1 = premier plan. */
function newCam() { return { x: 0, y: 0, zoom: 1, rot: 0 }; }
function pushCam(cam, depth) {
  var d = depth === undefined ? 1 : depth;
  var z = 1 + (cam.zoom - 1) * d;
  ctx.translate(CX, CY);
  ctx.rotate((cam.rot || 0) * d);
  ctx.scale(z, z);
  ctx.translate(-CX - cam.x * d, -CY - cam.y * d);
}

function rr(x, y, w, h, r) {
  var k = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.lineTo(x + w - k, y);     ctx.quadraticCurveTo(x + w, y, x + w, y + k);
  ctx.lineTo(x + w, y + h - k); ctx.quadraticCurveTo(x + w, y + h, x + w - k, y + h);
  ctx.lineTo(x + k, y + h);     ctx.quadraticCurveTo(x, y + h, x, y + h - k);
  ctx.lineTo(x, y + k);         ctx.quadraticCurveTo(x, y, x + k, y);
  ctx.closePath();
}
function poly(pts, close) {
  ctx.beginPath();
  for (var i = 0; i < pts.length; i++) {
    if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]); else ctx.lineTo(pts[i][0], pts[i][1]);
  }
  if (close !== false) ctx.closePath();
}
function softShadow(color, blur, dy, alpha) {
  ctx.shadowColor = rgba(color, alpha === undefined ? 0.35 : alpha);
  ctx.shadowBlur = blur; ctx.shadowOffsetY = dy || 0; ctx.shadowOffsetX = 0;
}
function noShadow() { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }

/* --------------------------------------------------------------------------
 * ATMOSPHERE  (LOOK.md §3)
 * ------------------------------------------------------------------------ */
function bgDeep(topMix) {
  var g = ctx.createLinearGradient(0, 0, 0, H);
  var m = topMix === undefined ? 0 : topMix;
  g.addColorStop(0,    mixHex(C.INK, C.BLUE, 0.22 + m));
  g.addColorStop(0.55, mixHex(C.INK, C.INK_2, 0.35));
  g.addColorStop(1,    C.INK);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function bgPaper() {
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.WHITE);
  g.addColorStop(0.62, C.PAPER);
  g.addColorStop(1, C.PAPER_2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function glow(x, y, r, color, alpha) {
  if (r <= 0 || alpha <= 0) return;
  var g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0,    rgba(color, alpha));
  g.addColorStop(0.45, rgba(color, alpha * 0.42));
  g.addColorStop(1,    rgba(color, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function vignette(strength, cx, cy) {
  var s = strength === undefined ? 0.5 : strength;
  var x = cx === undefined ? CX : cx, y = cy === undefined ? CY : cy;
  var g = ctx.createRadialGradient(x, y, H * 0.18, x, y, H * 1.02);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.62, 'rgba(0,0,0,' + (0.10 * s).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(0,0,0,' + (0.72 * s).toFixed(3) + ')');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

/* Grain : tuile de bruit pre-calculee une seule fois, decalage deterministe. */
var GRAIN = null;
function buildGrain() {
  var s = 256, c = document.createElement('canvas');
  c.width = s; c.height = s;
  var g = c.getContext('2d'), img = g.createImageData(s, s), d = img.data;
  for (var i = 0; i < s * s; i++) {
    var v = 128 + (hash1(i) - 0.5) * 205;
    d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v; d[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  GRAIN = ctx.createPattern(c, 'repeat');
}
function grain(t, amount) {
  if (!GRAIN) return;
  var f = Math.round(t * FPS);
  layer(function () {
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = amount === undefined ? 0.030 : amount;
    ctx.translate(-((f * 37) % 256), -((f * 61) % 256));
    ctx.fillStyle = GRAIN;
    ctx.fillRect(0, 0, W + 256, H + 256);
  });
}

/** Poussieres en suspension — positions issues de hash2, derive lente. */
function dustMotes(t, n, cx, cy, spread, color, alpha) {
  layer(function () {
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < n; i++) {
      var ph = hash2(i, 11) * 100;
      var x = cx + (hash2(i, 3) - 0.5) * spread + Math.sin(t * 0.33 + ph) * 26;
      var y = cy + (hash2(i, 5) - 0.5) * spread * 0.62 + Math.cos(t * 0.27 + ph) * 20;
      var r = 1.1 + hash2(i, 7) * 2.4;
      var a = alpha * (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 0.7 + ph)));
      ctx.fillStyle = rgba(color, a);
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    }
  });
}

/** Faisceau de videoprojecteur (trapeze degrade). */
function lightShaft(x0, y0, x1, y1, w0, w1, color, alpha) {
  var dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1;
  var nx = -dy / L, ny = dx / L;
  layer(function () {
    ctx.globalCompositeOperation = 'lighter';
    var g = ctx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, rgba(color, alpha));
    g.addColorStop(1, rgba(color, 0));
    poly([
      [x0 + nx * w0, y0 + ny * w0], [x1 + nx * w1, y1 + ny * w1],
      [x1 - nx * w1, y1 - ny * w1], [x0 - nx * w0, y0 - ny * w0]
    ]);
    ctx.fillStyle = g; ctx.fill();
  });
}

/** Sol reflechissant discret (plans sombres). */
function floorSheen(y, color, alpha) {
  layer(function () {
    var g = ctx.createLinearGradient(0, y, 0, H);
    g.addColorStop(0, rgba(color, alpha));
    g.addColorStop(1, rgba(color, 0));
    ctx.fillStyle = g; ctx.fillRect(0, y, W, H - y);
  });
}


/* ======================= src/02-type.js ======================= */
/* ============================================================================
 *  02 — TYPOGRAPHIE ANIMEE  (KIT.md §3)
 *  Toutes les fonctions prennent le temps absolu `t` et des bornes de beat.
 * ========================================================================== */

/** Chasse d'une chaine avec tracking applique lettre par lettre. */
function trackedWidth(text, tracking) {
  var chars = Array.from(text), tot = 0;
  for (var i = 0; i < chars.length; i++) tot += ctx.measureText(chars[i]).width + tracking;
  return chars.length ? tot - tracking : 0;
}
function drawTracked(text, x, y, tracking, align) {
  var chars = Array.from(text);
  var tot = trackedWidth(text, tracking);
  var cx = align === 'center' ? x - tot / 2 : align === 'right' ? x - tot : x;
  for (var i = 0; i < chars.length; i++) {
    ctx.fillText(chars[i], cx, y);
    cx += ctx.measureText(chars[i]).width + tracking;
  }
  return tot;
}

/**
 * titleAt — titre dont les lettres montent sous un masque horizontal.
 * Stagger « Layered Time » de `step` secondes par lettre (defaut 0.05 s).
 * opts : {tracking, weight, color, align, step, easeIn, outT0, outDur, shadow,
 *         alpha, scale}
 */
function titleAt(text, x, y, size, t, t0, dur, opts) {
  opts = opts || {};
  var tracking = opts.tracking === undefined ? -size * 0.015 : opts.tracking;
  var weight   = opts.weight || 900;
  var color    = opts.color || C.WHITE;
  var align    = opts.align || 'center';
  var step     = opts.step === undefined ? 0.05 : opts.step;
  var easeIn   = opts.easeIn || 'easeOutQuint';
  var outT0    = opts.outT0, outDur = opts.outDur || 0.42;
  var gAlpha   = opts.alpha === undefined ? 1 : opts.alpha;

  ctx.font = FT.display(size, weight);
  var chars = Array.from(text);
  var tot = trackedWidth(text, tracking);
  var startX = align === 'center' ? x - tot / 2 : align === 'right' ? x - tot : x;
  var bandTop = y - size * 1.12, bandH = size * 1.50;

  if (t < t0 - 0.001) return { width: tot, left: startX, right: startX + tot, cx: startX + tot / 2 };

  layer(function () {
    ctx.beginPath();
    ctx.rect(startX - size * 0.30, bandTop, tot + size * 0.60, bandH);
    ctx.clip();
    ctx.font = FT.display(size, weight);
    ctx.textBaseline = 'alphabetic';
    if (opts.shadow !== false) softShadow('#00070F', size * 0.34, size * 0.10, 0.46);
    var cx = startX, vis = 0;
    for (var i = 0; i < chars.length; i++) {
      var ch = chars[i], wch = ctx.measureText(ch).width;
      if (ch !== ' ') {
        var p = seg(t, t0 + vis * step, dur, easeIn);
        var o = outT0 !== undefined ? seg(t, outT0 + vis * step * 0.55, outDur, 'easeInCubic') : 0;
        if (p > 0.0005 && o < 0.9995) {
          var dy = (1 - p) * size * 1.22 - size * 1.40 * o;
          ctx.globalAlpha = Math.min(1, p * 1.3) * (1 - o) * gAlpha;
          ctx.fillStyle = color;
          ctx.fillText(ch, cx, y + dy);
        }
        vis++;
      }
      cx += wch + tracking;
    }
  });
  return { width: tot, left: startX, right: startX + tot, cx: startX + tot / 2 };
}

/** Mot-cle cinetique : entree clip-up, maintien, sortie backIn vers le haut. */
function kineticWord(text, x, y, size, t, t0, holdDur, opts) {
  opts = opts || {};
  var o = {};
  for (var k in opts) o[k] = opts[k];
  o.outT0 = t0 + holdDur;
  o.outDur = opts.outDur || 0.38;
  o.step = opts.step === undefined ? 0.045 : opts.step;
  return titleAt(text, x, y, size, t, t0, opts.dur || 0.46, o);
}

/** Micro-label capitales a tracking large. */
function labelTrack(text, x, y, size, t, t0, opts) {
  opts = opts || {};
  var p = seg(t, t0, opts.dur || 0.5, opts.easeIn || 'easeOutCubic');
  var o = opts.outT0 !== undefined ? seg(t, opts.outT0, opts.outDur || 0.35, 'easeInCubic') : 0;
  if (p <= 0.001 || o >= 0.999) return;
  layer(function () {
    ctx.font = FT.ui(size, opts.weight || 600);
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = p * (1 - o) * (opts.alpha === undefined ? 1 : opts.alpha);
    ctx.fillStyle = opts.color || C.ORANGE;
    if (opts.shadow) softShadow('#00070F', size * 0.8, size * 0.2, 0.5);
    ctx.translate(0, (1 - p) * size * 0.8);
    drawTracked(text, x, y, size * (opts.tracking === undefined ? 0.17 : opts.tracking), opts.align || 'center');
  });
}

/** Ligne de corps de texte : fade + rise. */
function bodyLine(text, x, y, size, t, t0, opts) {
  opts = opts || {};
  var p = seg(t, t0, opts.dur || 0.55, opts.easeIn || 'easeOutCubic');
  var o = opts.outT0 !== undefined ? seg(t, opts.outT0, opts.outDur || 0.35, 'easeInCubic') : 0;
  if (p <= 0.001 || o >= 0.999) return;
  layer(function () {
    ctx.font = opts.font || FT.ui(size, opts.weight || 500);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = opts.align || 'center';
    ctx.globalAlpha = p * (1 - o) * (opts.alpha === undefined ? 1 : opts.alpha);
    ctx.fillStyle = opts.color || C.WHITE;
    if (opts.shadow !== false) softShadow('#00070F', size * 0.55, size * 0.14, 0.45);
    ctx.fillText(text, x, y + (1 - p) * size * 0.62 - o * size * 0.45);
  });
}

/** Filet d'accent anime en scaleX. */
function accentRule(x, y, w, h, t, t0, opts) {
  opts = opts || {};
  var p = seg(t, t0, opts.dur || 0.5, opts.easeIn || 'easeOutCubic');
  var o = opts.outT0 !== undefined ? seg(t, opts.outT0, opts.outDur || 0.3, 'easeInCubic') : 0;
  if (p <= 0.001 || o >= 0.999) return;
  var origin = opts.origin || 'center';
  layer(function () {
    ctx.globalAlpha = (1 - o) * (opts.alpha === undefined ? 1 : opts.alpha);
    var ww = w * p;
    var xx = origin === 'center' ? x - ww / 2 : origin === 'right' ? x - ww : x;
    var g = ctx.createLinearGradient(xx, 0, xx + ww, 0);
    g.addColorStop(0, opts.c0 || C.ORANGE);
    g.addColorStop(1, opts.c1 || C.ORANGE_LT);
    ctx.fillStyle = g;
    softShadow(C.ORANGE, 26, 0, 0.5);
    rr(xx, y, ww, h, h / 2); ctx.fill();
  });
}

/** Suite de mots separes par des puces orange (ligne centree). */
function bulletRow(items, x, y, size, t, t0, opts) {
  opts = opts || {};
  var step = opts.step === undefined ? 0.14 : opts.step;
  var tr = size * (opts.tracking === undefined ? 0.10 : opts.tracking);
  ctx.font = FT.ui(size, opts.weight || 600);
  var widths = items.map(function (s) { return trackedWidth(s, tr); });
  var gap = size * 0.62, bulletW = size * 0.30;
  var tot = 0, i;
  for (i = 0; i < widths.length; i++) tot += widths[i];
  tot += (items.length - 1) * (gap * 2 + bulletW);
  var cx = x - tot / 2;

  for (i = 0; i < items.length; i++) {
    var p = seg(t, t0 + i * step, opts.dur || 0.5, 'easeOutCubic');
    var o = opts.outT0 !== undefined ? seg(t, opts.outT0 + i * 0.05, 0.3, 'easeInCubic') : 0;
    if (p > 0.001 && o < 0.999) {
      (function (p, o, cx, idx) {
        layer(function () {
          ctx.font = FT.ui(size, opts.weight || 600);
          ctx.textBaseline = 'alphabetic';
          ctx.globalAlpha = p * (1 - o);
          ctx.fillStyle = opts.color || C.WHITE;
          softShadow('#00070F', size * 0.6, size * 0.12, 0.42);
          ctx.translate(0, (1 - p) * size * 0.5);
          drawTracked(items[idx], cx, y, tr, 'left');
        });
      })(p, o, cx, i);
    }
    cx += widths[i];
    if (i < items.length - 1) {
      var pb = seg(t, t0 + i * step + 0.07, 0.3, 'easeOutCubic');
      var ob = opts.outT0 !== undefined ? seg(t, opts.outT0 + i * 0.05, 0.3, 'easeInCubic') : 0;
      if (pb > 0.001 && ob < 0.999) {
        (function (pb, ob, cx) {
          layer(function () {
            ctx.globalAlpha = pb * (1 - ob) * 0.95;
            ctx.fillStyle = C.ORANGE;
            ctx.beginPath();
            ctx.arc(cx + gap + bulletW / 2, y - size * 0.30, size * 0.105 * pb, 0, 6.2832);
            ctx.fill();
          });
        })(pb, ob, cx);
      }
      cx += gap * 2 + bulletW;
    }
  }
}

/** Carte-problematique (scene 1) : pastille + mot, ombre portee, parallax. */
function problemCard(text, x, y, scale, alpha, tint) {
  if (alpha <= 0.003) return;
  var size = 34;
  layer(function () {
    ctx.translate(x, y); ctx.scale(scale, scale);
    ctx.font = FT.ui(size, 700);
    var tw = trackedWidth(text, size * 0.09);
    var pw = tw + 104, ph = 76;
    ctx.globalAlpha = alpha;
    softShadow('#000814', 38, 14, 0.55);
    var g = ctx.createLinearGradient(-pw / 2, -ph / 2, pw / 2, ph / 2);
    g.addColorStop(0, rgba(mixHex(C.BLUE, C.INK, 0.25), 0.97));
    g.addColorStop(1, rgba(mixHex(C.BLUE, C.BLUE_LT, 0.30), 0.97));
    ctx.fillStyle = g;
    rr(-pw / 2, -ph / 2, pw, ph, 14); ctx.fill();
    noShadow();
    ctx.strokeStyle = rgba(tint || C.BLUE_LT, 0.55);
    ctx.lineWidth = 1.6;
    rr(-pw / 2, -ph / 2, pw, ph, 14); ctx.stroke();
    // pastille d'accent
    ctx.fillStyle = tint || C.ORANGE;
    ctx.beginPath(); ctx.arc(-pw / 2 + 36, 0, 9, 0, 6.2832); ctx.fill();
    // libelle
    ctx.fillStyle = C.WHITE;
    ctx.textBaseline = 'middle';
    drawTracked(text, -pw / 2 + 62, 2, size * 0.09, 'left');
  });
}


/* ======================= src/03-figures.js ======================= */
/* ============================================================================
 *  03 — PERSONNAGES & MOBILIER  (KIT.md §4 et §5)
 *  Silhouettes stylisees : formes pleines, proportions adultes (tete ~ h/7.5),
 *  aucun visage, aucun trait caricatural. Modele par rim-light a deux sources.
 * ========================================================================== */

/** Remplit un trace avec une couleur de base + un liseré lumineux d'un cote. */
function rimFill(drawPath, bbox, base, rim, side, strength) {
  layer(function () {
    drawPath();
    ctx.fillStyle = base;
    ctx.fill();
    ctx.clip();
    var x0 = bbox[0], y0 = bbox[1], x1 = bbox[2], y1 = bbox[3];
    var g, k = 0.20;                       // liseré étroit : 20 % de la largeur
    if (side === 'l') g = ctx.createLinearGradient(x0, 0, x0 + (x1 - x0) * k, 0);
    else if (side === 't') g = ctx.createLinearGradient(0, y0, 0, y0 + (y1 - y0) * k);
    else g = ctx.createLinearGradient(x1, 0, x1 - (x1 - x0) * k, 0);
    g.addColorStop(0, rgba(rim, strength === undefined ? 0.62 : strength));
    g.addColorStop(0.45, rgba(rim, (strength === undefined ? 0.62 : strength) * 0.22));
    g.addColorStop(1, rgba(rim, 0));
    ctx.fillStyle = g;
    ctx.fillRect(x0 - 4, y0 - 4, (x1 - x0) + 8, (y1 - y0) + 8);
  });
}

function ellipsePath(x, y, rx, ry, rot) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, 6.2832);
}

/* --------------------------------------------------------------------------
 * Participant assis, vu de trois quarts dos — rang de salle.
 * p : {x, y(base des epaules), h(hauteur tete+torse), color, rim, rimSide,
 *      lean(0..1 penche vers l'avant), turn(-1..1), alpha}
 * ------------------------------------------------------------------------ */
function figureAudience(p) {
  var h = p.h, x = p.x, y = p.y;
  var headR = h * 0.142;
  var shW = h * 0.42, shH = h * 0.66;
  var lean = (p.lean || 0) * h * 0.070;
  var turn = (p.turn || 0);
  var base = p.color || C.BLUE;
  var rim = p.rim || C.BLUE_LT;
  var side = p.rimSide || 'r';
  layer(function () {
    ctx.globalAlpha = p.alpha === undefined ? 1 : p.alpha;
    ctx.translate(0, lean * 0.35);
    var ty = y;
    // torse : flancs droits, epaules en pente, encolure trapezoidale
    var bbT = [x - shW, ty - shH, x + shW, ty + 12];
    rimFill(function () {
      ctx.beginPath();
      ctx.moveTo(x - shW, ty + 12);
      ctx.lineTo(x - shW * 0.94, ty - shH * 0.46);
      ctx.quadraticCurveTo(x - shW * 0.90, ty - shH * 0.73, x - shW * 0.47, ty - shH * 0.82);
      ctx.quadraticCurveTo(x - shW * 0.22 + turn * shW * 0.12, ty - shH * 0.87,
                           x + turn * shW * 0.14, ty - shH * 0.885);
      ctx.quadraticCurveTo(x + shW * 0.24 + turn * shW * 0.12, ty - shH * 0.87,
                           x + shW * 0.47, ty - shH * 0.82);
      ctx.quadraticCurveTo(x + shW * 0.90, ty - shH * 0.73, x + shW * 0.94, ty - shH * 0.46);
      ctx.lineTo(x + shW, ty + 12);
      ctx.closePath();
    }, bbT, base, rim, side, p.rimStrength);
    // cou
    ctx.fillStyle = base;
    rr(x + turn * shW * 0.20 - h * 0.062, ty - shH * 0.96, h * 0.124, h * 0.13, h * 0.045);
    ctx.fill();
    // tete
    var hx = x + turn * shW * 0.34, hy = ty - shH * 0.93 - headR * 1.00 - lean * 0.5;
    var bbH = [hx - headR, hy - headR * 1.14, hx + headR, hy + headR * 1.14];
    rimFill(function () { ellipsePath(hx, hy, headR * 0.88, headR * 1.06, turn * 0.14); },
      bbH, base, rim, side, p.rimStrength);
  });
}

/* --------------------------------------------------------------------------
 * Participant levant la main (question).
 * ------------------------------------------------------------------------ */
function figureRaisedHand(p) {
  var h = p.h, x = p.x, y = p.y;
  var raise = p.raise === undefined ? 1 : p.raise;
  var base = p.color || C.BLUE;
  var rim = p.rim || C.ORANGE_LT;
  layer(function () {
    ctx.globalAlpha = p.alpha === undefined ? 1 : p.alpha;
    figureAudience({ x: x, y: y, h: h, color: base, rim: rim, rimSide: p.rimSide || 'r', turn: 0.15 });
    // bras leve : epaule -> coude -> main
    var sx = x + h * 0.325, sy = y - h * 0.515;
    var ex = sx + h * 0.085 + raise * h * 0.045, ey = sy - h * 0.185 * raise - h * 0.02;
    var mx = ex + h * 0.015, my = ey - h * 0.255 * raise;
    ctx.strokeStyle = base; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = h * 0.100;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.lineTo(mx, my); ctx.stroke();
    // main
    ctx.fillStyle = base;
    ellipsePath(mx, my - h * 0.032, h * 0.058, h * 0.068, 0); ctx.fill();
    // liseré lumineux sur l'arete exterieure du bras
    ctx.strokeStyle = rgba(rim, 0.45); ctx.lineWidth = h * 0.016;
    ctx.beginPath();
    ctx.moveTo(sx + h * 0.042, sy); ctx.lineTo(ex + h * 0.042, ey);
    ctx.lineTo(mx + h * 0.042, my - h * 0.02); ctx.stroke();
  });
}

/* --------------------------------------------------------------------------
 * Intervenant debout, geste de presentation.
 * p : {x, y(sol), h(hauteur totale), arm(0..1 amplitude du geste), color, rim}
 * ------------------------------------------------------------------------ */
function figureStanding(p) {
  var h = p.h, x = p.x, y = p.y;
  var base = p.color || mixHex(C.BLUE, C.INK, 0.15);
  var rim = p.rim || C.ORANGE_LT;
  var headR = h * 0.062;
  var arm = p.arm === undefined ? 0.6 : p.arm;
  var flip = p.flip ? -1 : 1;
  layer(function () {
    ctx.globalAlpha = p.alpha === undefined ? 1 : p.alpha;
    ctx.translate(x, y); ctx.scale(flip, 1);
    // jambes
    ctx.strokeStyle = base; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = h * 0.072;
    ctx.beginPath();
    ctx.moveTo(-h * 0.030, -h * 0.46); ctx.lineTo(-h * 0.055, -h * 0.015);
    ctx.moveTo(h * 0.034, -h * 0.46);  ctx.lineTo(h * 0.062, -h * 0.015);
    ctx.stroke();
    // torse
    var bb = [-h * 0.10, -h * 0.80, h * 0.10, -h * 0.40];
    rimFill(function () {
      ctx.beginPath();
      ctx.moveTo(-h * 0.052, -h * 0.425);
      ctx.bezierCurveTo(-h * 0.098, -h * 0.55, -h * 0.100, -h * 0.70, -h * 0.078, -h * 0.775);
      ctx.bezierCurveTo(-h * 0.030, -h * 0.805, h * 0.030, -h * 0.805, h * 0.078, -h * 0.775);
      ctx.bezierCurveTo(h * 0.100, -h * 0.70, h * 0.098, -h * 0.55, h * 0.052, -h * 0.425);
      ctx.closePath();
    }, bb, base, rim, 'r', 0.5);
    // bras de geste (vers l'ecran)
    var sx = h * 0.072, sy = -h * 0.755;
    var ex = sx + h * 0.085 + arm * h * 0.035, ey = sy + h * 0.085 - arm * h * 0.055;
    var hx = ex + h * 0.085 + arm * h * 0.055, hy = ey - h * 0.025 - arm * h * 0.085;
    ctx.strokeStyle = base; ctx.lineWidth = h * 0.044;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.strokeStyle = rgba(rim, 0.55); ctx.lineWidth = h * 0.011;
    ctx.beginPath(); ctx.moveTo(sx, sy - 2); ctx.lineTo(ex, ey - 2); ctx.lineTo(hx, hy - 2); ctx.stroke();
    ctx.fillStyle = base; ellipsePath(hx, hy, h * 0.024, h * 0.027, 0); ctx.fill();
    // bras arriere
    ctx.strokeStyle = rgba(base, 0.9); ctx.lineWidth = h * 0.040;
    ctx.beginPath(); ctx.moveTo(-sx, sy); ctx.lineTo(-sx - h * 0.018, sy + h * 0.15); ctx.stroke();
    // cou + tete
    ctx.fillStyle = base;
    rr(-h * 0.020, -h * 0.825, h * 0.040, h * 0.035, h * 0.015); ctx.fill();
    var bbh = [-headR * 1.2, -h * 0.825 - headR * 2.2, headR * 1.2, -h * 0.80];
    rimFill(function () { ellipsePath(0, -h * 0.825 - headR * 0.95, headR * 0.94, headR * 1.08, 0); },
      bbh, base, rim, 'r', 0.5);
  });
}

/* --------------------------------------------------------------------------
 * Entrepreneur assis a son poste de travail, trois quarts (scene 1).
 * ------------------------------------------------------------------------ */
function figureSeated(p) {
  var h = p.h, x = p.x, y = p.y; // y = assise
  var base = p.color || mixHex(C.BLUE, C.INK, 0.12);
  var rim = p.rim || C.BLUE_LT;
  var rim2 = p.rim2 || C.ORANGE_LT;
  var headR = h * 0.105;
  var breathe = p.breathe || 0;
  layer(function () {
    ctx.globalAlpha = p.alpha === undefined ? 1 : p.alpha;
    ctx.translate(x, y + breathe);
    // torse incline vers la table
    var bb = [-h * 0.30, -h * 0.80, h * 0.30, 0];
    rimFill(function () {
      ctx.beginPath();
      ctx.moveTo(-h * 0.255, h * 0.02);
      ctx.bezierCurveTo(-h * 0.300, -h * 0.30, -h * 0.280, -h * 0.60, -h * 0.185, -h * 0.705);
      ctx.bezierCurveTo(-h * 0.080, -h * 0.780, h * 0.090, -h * 0.775, h * 0.175, -h * 0.700);
      ctx.bezierCurveTo(h * 0.268, -h * 0.58, h * 0.292, -h * 0.28, h * 0.250, h * 0.02);
      ctx.closePath();
    }, bb, base, rim, 'l', 0.46);
    // liseré chaud cote droit
    layer(function () {
      ctx.beginPath();
      ctx.moveTo(-h * 0.255, h * 0.02);
      ctx.bezierCurveTo(-h * 0.300, -h * 0.30, -h * 0.280, -h * 0.60, -h * 0.185, -h * 0.705);
      ctx.bezierCurveTo(-h * 0.080, -h * 0.780, h * 0.090, -h * 0.775, h * 0.175, -h * 0.700);
      ctx.bezierCurveTo(h * 0.268, -h * 0.58, h * 0.292, -h * 0.28, h * 0.250, h * 0.02);
      ctx.closePath(); ctx.clip();
      var g = ctx.createLinearGradient(h * 0.30, 0, h * 0.02, 0);
      g.addColorStop(0, rgba(rim2, 0.42)); g.addColorStop(1, rgba(rim2, 0));
      ctx.fillStyle = g; ctx.fillRect(-h * 0.32, -h * 0.82, h * 0.64, h * 0.9);
    });
    // bras avant-droit pose sur la table
    ctx.strokeStyle = base; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = h * 0.095;
    ctx.beginPath();
    ctx.moveTo(h * 0.195, -h * 0.605); ctx.lineTo(h * 0.330, -h * 0.330); ctx.lineTo(h * 0.470, -h * 0.250);
    ctx.stroke();
    ctx.strokeStyle = rgba(rim2, 0.42); ctx.lineWidth = h * 0.016;
    ctx.beginPath();
    ctx.moveTo(h * 0.225, -h * 0.605); ctx.lineTo(h * 0.358, -h * 0.330); ctx.lineTo(h * 0.492, -h * 0.252);
    ctx.stroke();
    // bras gauche
    ctx.strokeStyle = rgba(base, 0.95); ctx.lineWidth = h * 0.085;
    ctx.beginPath();
    ctx.moveTo(-h * 0.205, -h * 0.600); ctx.lineTo(-h * 0.300, -h * 0.330); ctx.lineTo(-h * 0.165, -h * 0.245);
    ctx.stroke();
    // cou
    ctx.fillStyle = base;
    rr(-h * 0.052, -h * 0.805, h * 0.104, h * 0.075, h * 0.035); ctx.fill();
    // tete legerement penchee
    var bbh = [-headR * 1.3, -h * 0.80 - headR * 2.3, headR * 1.3, -h * 0.76];
    rimFill(function () { ellipsePath(h * 0.012, -h * 0.805 - headR * 0.90, headR * 0.93, headR * 1.07, -0.07); },
      bbh, base, rim, 'l', 0.46);
  });
}

/* --------------------------------------------------------------------------
 * Rangee procedurale de participants (parallax de salle).
 * p : {y, h, n, x0, step, color, rim, t, alpha, depthTint}
 * ------------------------------------------------------------------------ */
function crowdRow(p) {
  var n = p.n, t = p.t || 0;
  for (var i = 0; i < n; i++) {
    var jx = (hash2(i, p.seed || 1) - 0.5) * p.step * 0.30;
    var jh = 1 + (hash2(i, (p.seed || 1) + 40) - 0.5) * 0.14;
    var ph = hash2(i, (p.seed || 1) + 80) * 6.2832;
    // prise de notes : oscillation sinusoidale dephasee (deterministe)
    var noteAmp = (hash2(i, (p.seed || 1) + 120) > 0.45) ? 1 : 0;
    var lean = noteAmp * (0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * 1.15 + ph)));
    var turn = (hash2(i, (p.seed || 1) + 160) - 0.5) * 0.55;
    figureAudience({
      x: p.x0 + i * p.step + jx,
      y: p.y + (hash2(i, (p.seed || 1) + 200) - 0.5) * 6,
      h: p.h * jh,
      color: p.color, rim: p.rim,
      rimSide: (i % 2) ? 'r' : 'l',
      rimStrength: p.rimStrength,
      lean: lean, turn: turn,
      alpha: p.alpha === undefined ? 1 : p.alpha
    });
  }
}

/* --------------------------------------------------------------------------
 * Silhouette compacte pour la scene communaute (14 gabarits).
 * ------------------------------------------------------------------------ */
function figureIcon(p) {
  var h = p.h, x = p.x, y = p.y;
  var base = p.color || C.BLUE_LT;
  var sw = h * (p.shoulder || 0.40);          // demi-largeur d'epaules (variante)
  var headR = h * (p.headR || 0.235);
  var tilt = p.tilt || 0;
  layer(function () {
    ctx.globalAlpha = p.alpha === undefined ? 1 : p.alpha;
    if (p.glowA) { glow(x, y - h * 0.45, h * 1.1, p.glowC || C.BLUE_LT, p.glowA); }
    ctx.fillStyle = base;
    // buste : flancs droits et epaules en pente (pas de champignon)
    ctx.beginPath();
    ctx.moveTo(x - sw, y);
    ctx.lineTo(x - sw * 0.95, y - h * 0.30);
    ctx.quadraticCurveTo(x - sw * 0.92, y - h * 0.50, x - sw * 0.44, y - h * 0.57);
    ctx.quadraticCurveTo(x - sw * 0.18, y - h * 0.62, x + tilt * sw * 0.18, y - h * 0.635);
    ctx.quadraticCurveTo(x + sw * 0.20, y - h * 0.62, x + sw * 0.46, y - h * 0.57);
    ctx.quadraticCurveTo(x + sw * 0.94, y - h * 0.50, x + sw * 0.97, y - h * 0.30);
    ctx.lineTo(x + sw, y);
    ctx.closePath(); ctx.fill();
    // cou
    rr(x + tilt * sw * 0.2 - h * 0.055, y - h * 0.70, h * 0.11, h * 0.10, h * 0.04); ctx.fill();
    // tete
    var hx = x + tilt * sw * 0.30, hy = y - h * 0.685 - headR * 0.90;
    ellipsePath(hx, hy, headR * 0.86, headR, tilt * 0.12); ctx.fill();
    if (p.rim) {
      ctx.strokeStyle = rgba(p.rim, 0.5); ctx.lineWidth = Math.max(1.2, h * 0.028);
      ellipsePath(hx, hy, headR * 0.86, headR, tilt * 0.12); ctx.stroke();
    }
  });
}

/* --------------------------------------------------------------------------
 * Duo en echange + poignee de main (scene 3 networking).
 * ------------------------------------------------------------------------ */
function figurePair(p) {
  var h = p.h, x = p.x, y = p.y;
  var shake = p.shake === undefined ? 0 : p.shake;
  figureStanding({ x: x - h * 0.17, y: y, h: h, color: p.c1 || C.BLUE, rim: C.BLUE_LT, arm: 0.1 });
  figureStanding({ x: x + h * 0.17, y: y, h: h, color: p.c2 || mixHex(C.BLUE, C.SLATE, 0.5), rim: C.ORANGE_LT, arm: 0.1, flip: true });
  if (shake > 0.01) {
    layer(function () {
      ctx.globalAlpha = Math.min(1, shake);
      var yy = y - h * 0.50;
      ctx.strokeStyle = p.c1 || C.BLUE; ctx.lineCap = 'round';
      ctx.lineWidth = h * 0.040;
      ctx.beginPath();
      ctx.moveTo(x - h * 0.095, y - h * 0.615); ctx.lineTo(x - h * 0.012, yy); ctx.stroke();
      ctx.strokeStyle = p.c2 || mixHex(C.BLUE, C.SLATE, 0.5);
      ctx.beginPath();
      ctx.moveTo(x + h * 0.095, y - h * 0.615); ctx.lineTo(x + h * 0.012, yy); ctx.stroke();
      // lueur de contact
      glow(x, yy, h * 0.17 * shake, C.ORANGE, 0.55 * shake);
      ctx.fillStyle = C.ORANGE_LT;
      ellipsePath(x, yy, h * 0.030, h * 0.026, 0); ctx.fill();
    });
  }
}

/* ==========================================================================
 * MOBILIER & OBJETS DE SCENE
 * ======================================================================== */

/** Dossier de chaise (premier plan de salle). */
function chairBack(x, y, w, h, color, alpha) {
  layer(function () {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = color;
    rr(x - w / 2, y - h, w, h, w * 0.14); ctx.fill();
    ctx.fillStyle = rgba('#000000', 0.25);
    rr(x - w / 2, y - h * 0.22, w, h * 0.22, 6); ctx.fill();
  });
}

/** Pupitre d'intervenant. */
function podium(x, y, w, h, color, rim) {
  layer(function () {
    ctx.fillStyle = color;
    poly([[x - w / 2, y], [x - w * 0.40, y - h], [x + w * 0.40, y - h], [x + w / 2, y]]);
    ctx.fill();
    var g = ctx.createLinearGradient(0, y - h, 0, y);
    g.addColorStop(0, rgba(rim, 0.35)); g.addColorStop(1, rgba(rim, 0));
    ctx.fillStyle = g;
    poly([[x - w / 2, y], [x - w * 0.40, y - h], [x + w * 0.40, y - h], [x + w / 2, y]]);
    ctx.fill();
    ctx.fillStyle = rgba(C.ORANGE, 0.9);
    rr(x - w * 0.14, y - h * 0.62, w * 0.28, 5, 2.5); ctx.fill();
  });
}

/**
 * Ecran de scene. `content(innerRect)` dessine le contenu projete.
 * Retourne le rectangle interieur (utile pour le portail de transition).
 */
function stageScreen(x, y, w, h, prog, content, opts) {
  opts = opts || {};
  var pw = w * prog, ph = h * prog;
  var rect = { x: x - pw / 2, y: y - ph / 2, w: pw, h: ph };
  layer(function () {
    // cadre
    softShadow('#000814', 60, 18, 0.6);
    ctx.fillStyle = mixHex(C.INK, C.BLUE, 0.35);
    rr(rect.x - 14, rect.y - 14, rect.w + 28, rect.h + 28, 10); ctx.fill();
    noShadow();
    // surface
    var g = ctx.createLinearGradient(rect.x, rect.y, rect.x, rect.y + rect.h);
    g.addColorStop(0, mixHex(C.BLUE, C.BLUE_LT, 0.30));
    g.addColorStop(1, mixHex(C.INK, C.BLUE, 0.55));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.rect(rect.x, rect.y, rect.w, rect.h); ctx.fill();
    if (content) {
      layer(function () {
        ctx.beginPath(); ctx.rect(rect.x, rect.y, rect.w, rect.h); ctx.clip();
        content(rect);
      });
    }
    // reflet diagonal
    layer(function () {
      ctx.beginPath(); ctx.rect(rect.x, rect.y, rect.w, rect.h); ctx.clip();
      var r = ctx.createLinearGradient(rect.x, rect.y, rect.x + rect.w * 0.8, rect.y + rect.h);
      r.addColorStop(0, 'rgba(255,255,255,0.10)');
      r.addColorStop(0.45, 'rgba(255,255,255,0.02)');
      r.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = r; ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
    });
    ctx.strokeStyle = rgba(C.BLUE_PALE, 0.30); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.rect(rect.x, rect.y, rect.w, rect.h); ctx.stroke();
  });
  return rect;
}

/** Poste de travail en perspective : plateau, lampe, ecran, carnet, dossiers. */
function deskSetup(p) {
  var cx = p.x, y = p.y, w = p.w, prog = p.prog === undefined ? 1 : p.prog, t = p.t || 0;
  var pTop   = seg(prog, 0, 1, 'linear');
  layer(function () {
    ctx.globalAlpha = p.alpha === undefined ? 1 : p.alpha;
    // plateau en perspective
    var pw = w * (0.55 + 0.45 * pTop);
    var depth = p.depth || 150;
    softShadow('#000510', 70, -10, 0.65);
    var g = ctx.createLinearGradient(0, y - depth, 0, y + 40);
    g.addColorStop(0, mixHex(C.BLUE, C.INK, 0.45));
    g.addColorStop(1, mixHex(C.INK, C.BLUE, 0.18));
    ctx.fillStyle = g;
    poly([[cx - pw / 2, y], [cx - pw * 0.40, y - depth], [cx + pw * 0.40, y - depth], [cx + pw / 2, y]]);
    ctx.fill();
    noShadow();
    // arête lumineuse du plateau
    ctx.strokeStyle = rgba(C.ORANGE_LT, 0.45); ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(cx - pw * 0.40, y - depth); ctx.lineTo(cx + pw * 0.40, y - depth); ctx.stroke();
    ctx.strokeStyle = rgba(C.BLUE_PALE, 0.22); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - pw / 2, y); ctx.lineTo(cx + pw / 2, y); ctx.stroke();
  });
}

/** Carnet avec lignes d'ecriture tracees progressivement. */
function notebook(p) {
  var x = p.x, y = p.y, w = p.w, h = p.h, prog = p.prog === undefined ? 1 : p.prog;
  var rot = p.rot || 0;
  layer(function () {
    ctx.globalAlpha = p.alpha === undefined ? 1 : p.alpha;
    ctx.translate(x, y); ctx.rotate(rot);
    softShadow('#000814', 30, 12, 0.5);
    ctx.fillStyle = p.paper || C.PAPER;
    rr(-w / 2, -h / 2, w, h, 8); ctx.fill();
    noShadow();
    ctx.fillStyle = rgba(C.ORANGE, 0.85);
    rr(-w / 2, -h / 2, w * 0.055, h, 8); ctx.fill();
    // lignes
    var nL = p.lines || 5;
    for (var i = 0; i < nL; i++) {
      var lp = clamp01((prog - i * (0.8 / nL)) / (0.8 / nL));
      if (lp <= 0) break;
      var lw = (w * (0.62 + hash2(i, 9) * 0.22)) * easeOutCubic(lp);
      ctx.fillStyle = rgba(C.SLATE, 0.55);
      rr(-w * 0.36, -h / 2 + h * (0.20 + i * (0.62 / nL)), lw, Math.max(2, h * 0.035), 2);
      ctx.fill();
    }
  });
}

/** Bulle de dialogue. */
function speechBubble(p) {
  var x = p.x, y = p.y, w = p.w, h = p.h, prog = p.prog === undefined ? 1 : p.prog;
  if (prog <= 0.01) return;
  var s = elasticSoft(prog, 0.3);
  layer(function () {
    ctx.globalAlpha = Math.min(1, prog * 1.6) * (p.alpha === undefined ? 1 : p.alpha);
    ctx.translate(x, y); ctx.scale(s, s);
    softShadow('#000814', 26, 10, 0.45);
    ctx.fillStyle = p.fill || rgba(C.WHITE, 0.95);
    rr(-w / 2, -h / 2, w, h, h * 0.30); ctx.fill();
    poly([[(p.flip ? 1 : -1) * w * 0.22, h / 2 - 2], [(p.flip ? 1 : -1) * w * 0.38, h / 2 + h * 0.34], [(p.flip ? 1 : -1) * w * 0.06, h / 2 - 2]]);
    ctx.fill();
    noShadow();
    // lignes de contenu
    for (var i = 0; i < 2; i++) {
      ctx.fillStyle = rgba(C.SLATE, 0.42);
      rr(-w * 0.34, -h * 0.18 + i * h * 0.26, w * (0.56 - i * 0.18), h * 0.11, h * 0.055);
      ctx.fill();
    }
  });
}

/** Carte de visite qui s'echange. */
function businessCard(x, y, w, rot, alpha) {
  layer(function () {
    ctx.globalAlpha = alpha;
    ctx.translate(x, y); ctx.rotate(rot);
    softShadow('#000814', 18, 6, 0.5);
    ctx.fillStyle = C.PAPER; rr(-w / 2, -w * 0.3, w, w * 0.6, 4); ctx.fill();
    noShadow();
    ctx.fillStyle = rgba(C.ORANGE, 0.9); rr(-w * 0.42, -w * 0.18, w * 0.30, w * 0.06, 3); ctx.fill();

/* ============================================================================
 *  04 — OBJETS THEMATIQUES, DATA-VIZ ET RESEAU  (KIT.md §6 et §7)
 *  Chaque objet recoit prog dans [0,1] et s'assemble sous-element par
 *  sous-element (stagger interne 0.05 s equivalent, courbe elasticSoft).
 * ========================================================================== */

/** Progression du sous-element i (stagger interne). */
function sp(prog, i, ease) {
  var q = clamp01((prog - i * 0.085) / 0.56);
  var f = typeof ease === 'function' ? ease : null;
  return f ? f(q) : elasticSoft(q, 0.30);
}
function spL(prog, i) { return clamp01((prog - i * 0.085) / 0.56); }

/* --------------------------------------------------------------------------
 * DATA-VIZ
 * ------------------------------------------------------------------------ */

/** Histogramme a barres croissantes. */
function barChart(p) {
  var x = p.x, y = p.y, w = p.w, h = p.h, n = p.n || 5, prog = p.prog;
  var bw = w / (n * 1.75);
  layer(function () {
    ctx.globalAlpha = p.alpha === undefined ? 1 : p.alpha;
    for (var i = 0; i < n; i++) {
      var q = sp(prog, i, easeOutQuart);
      if (q <= 0.001) continue;
      var bh = h * (0.30 + hash2(i, p.seed || 21) * 0.70) * q;
      var bx = x - w / 2 + i * (w / n) + (w / n - bw) / 2;
      var g = ctx.createLinearGradient(0, y - bh, 0, y);
      g.addColorStop(0, i === n - 1 ? C.ORANGE_LT : C.BLUE_LT);
      g.addColorStop(1, i === n - 1 ? C.ORANGE : mixHex(C.BLUE_LT, C.BLUE, 0.75));
      ctx.fillStyle = g;
      rr(bx, y - bh, bw, bh, Math.min(5, bw * 0.22)); ctx.fill();
    }
    ctx.strokeStyle = rgba(C.BLUE_PALE, 0.35); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - w / 2, y + 1); ctx.lineTo(x + w / 2, y + 1); ctx.stroke();
  });
}

/** Courbe ascendante tracee progressivement (+ point de tete lumineux). */
function lineChart(p) {
  var x = p.x, y = p.y, w = p.w, h = p.h, n = p.n || 7, prog = easeInOutCubic(clamp01(p.prog));
  if (prog <= 0.002) return;
  var pts = [];
  for (var i = 0; i < n; i++) {
    var fx = x - w / 2 + (w * i) / (n - 1);
    var fy = y - h * (0.12 + 0.88 * Math.pow(i / (n - 1), 1.35)) - (hash2(i, p.seed || 5) - 0.5) * h * 0.12;
    pts.push([fx, fy]);
  }
  var total = (n - 1) * prog;
  layer(function () {
    ctx.globalAlpha = p.alpha === undefined ? 1 : p.alpha;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = p.color || C.ORANGE;
    ctx.lineWidth = p.lw || 5;
    softShadow(p.color || C.ORANGE, 22, 0, 0.6);
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    var k = Math.floor(total), f = total - k, hx = pts[0][0], hy = pts[0][1];
    for (var i = 1; i <= k && i < n; i++) { ctx.lineTo(pts[i][0], pts[i][1]); hx = pts[i][0]; hy = pts[i][1]; }
    if (k < n - 1) {
      hx = lerp(pts[k][0], pts[k + 1][0], f); hy = lerp(pts[k][1], pts[k + 1][1], f);
      ctx.lineTo(hx, hy);
    }
    ctx.stroke();
    noShadow();
    glow(hx, hy, 34, p.color || C.ORANGE, 0.55);
    ctx.fillStyle = C.WHITE;
    ctx.beginPath(); ctx.arc(hx, hy, 6.5, 0, 6.2832); ctx.fill();
  });
}

/** Cadran a aiguille. */
function gauge(p) {
  var x = p.x, y = p.y, r = p.r, prog = p.prog, val = p.val === undefined ? 0.72 : p.val;
  var q = elasticSoft(clamp01(prog), 0.28);
  if (q <= 0.002) return;
  layer(function () {
    ctx.globalAlpha = p.alpha === undefined ? 1 : p.alpha;
    ctx.translate(x, y); ctx.scale(q, q);
    ctx.fillStyle = p.bg || C.WHITE;
    softShadow('#0A2440', 26, 10, 0.22);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.fill();
    noShadow();
    ctx.strokeStyle = rgba(C.BLUE, 0.16); ctx.lineWidth = r * 0.16;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.74, Math.PI * 0.82, Math.PI * 2.18); ctx.stroke();
    ctx.strokeStyle = C.ORANGE; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.74, Math.PI * 0.82, Math.PI * 0.82 + Math.PI * 1.36 * val * clamp01(prog * 1.4));
    ctx.stroke();
    // aiguille
    var a = Math.PI * 0.82 + Math.PI * 1.36 * val * clamp01(prog * 1.4);
    ctx.strokeStyle = C.BLUE; ctx.lineWidth = r * 0.085;
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a) * r * 0.55, Math.sin(a) * r * 0.55); ctx.stroke();
    ctx.fillStyle = C.BLUE;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.11, 0, 6.2832); ctx.fill();
  });

/** Graphe de reseau : noeuds + aretes a tracé progressif. */
function networkGraph(p) {
  var nodes = p.nodes, prog = p.prog, edges = p.edges;
  layer(function () {
    ctx.globalAlpha = p.alpha === undefined ? 1 : p.alpha;
    ctx.lineCap = 'round';
    for (var e = 0; e < edges.length; e++) {
      var q = clamp01((prog - e * 0.055) / 0.42);
      if (q <= 0.001) continue;
      q = easeInOutCubic(q);
      var a = nodes[edges[e][0]], b = nodes[edges[e][1]];
      ctx.strokeStyle = rgba(p.edgeColor || C.ORANGE, (p.edgeAlpha || 0.55) * q);
      ctx.lineWidth = p.lw || 2.4;
      ctx.beginPath(); ctx.moveTo(a[0], a[1]);
      ctx.lineTo(lerp(a[0], b[0], q), lerp(a[1], b[1], q));
      ctx.stroke();
    }
    for (var i = 0; i < nodes.length; i++) {
      var qn = elasticSoft(clamp01((prog - i * 0.04) / 0.4), 0.3);
      if (qn <= 0.001) continue;
      var r = (p.r || 7) * qn;
      glow(nodes[i][0], nodes[i][1], r * 3.2, p.nodeGlow || C.BLUE_LT, 0.30);
      ctx.fillStyle = p.nodeColor || C.WHITE;
      ctx.beginPath(); ctx.arc(nodes[i][0], nodes[i][1], r, 0, 6.2832); ctx.fill();
    }
  });

/** Anneau central de la scene communaute. */
function ringOrbit(p) {
  var x = p.x, y = p.y, r = p.r, prog = clamp01(p.prog), t = p.t;
  if (prog <= 0.002 || r <= 0) return;
  layer(function () {
    ctx.globalAlpha = p.alpha === undefined ? 1 : p.alpha;
    ctx.translate(x, y);
    glow(0, 0, r * 1.5, C.BLUE_LT, 0.18 * prog);
    ctx.rotate(t * 0.28);
    ctx.strokeStyle = rgba(C.ORANGE, 0.85 * prog);
    ctx.lineWidth = 3.5; ctx.lineCap = 'round';

    for (var i = 0; i < segs; i++) {
      var a0 = (i / segs) * 6.2832, a1 = a0 + 6.2832 / segs * 0.56;

      if (vis <= 0) break;
      ctx.globalAlpha = (p.alpha === undefined ? 1 : p.alpha) * vis * 0.9;
      ctx.beginPath(); ctx.arc(0, 0, r, a0, lerp(a0, a1, vis)); ctx.stroke();
    }
    ctx.globalAlpha = (p.alpha === undefined ? 1 : p.alpha) * prog;
    ctx.strokeStyle = rgba(C.BLUE_PALE, 0.22); ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.18, 0, 6.2832); ctx.stroke();
  });
}

/* ============================================================================
 *  05 — TRANSITIONS, COMPOSITING ET MARQUE  (KIT.md §8 et §9)
 *  Les transitions qui ont besoin de l'image complete passent par un tampon
 *  hors-ecran : on redirige `ctx` vers le tampon, on dessine, on recompose.
 * ========================================================================== */

var OFF = document.createElement('canvas');
OFF.width = W; OFF.height = H;
var octx = OFF.getContext('2d', { alpha: false });

/** Execute `fn` en redirigeant tout le dessin vers le tampon hors-ecran. */
function withOffscreen(fn) {
  var prev = ctx;
  ctx = octx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  noShadow();
  try { fn(); } finally { ctx = prev; }
}

/* --------------------------------------------------------------------------
 * Lame diagonale : clip de la zone balayee, puis wipe colore.
 * ------------------------------------------------------------------------ */
function diagonalPath(prog, angle, overshoot) {
  var a = angle === undefined ? -0.32 : angle;    // ~18 deg
  var span = W + Math.abs(Math.tan(a)) * H + (overshoot || 0);
  var edge = -Math.abs(Math.tan(a)) * H + prog * span;
  ctx.beginPath();
  ctx.moveTo(-10, -10);
  ctx.lineTo(edge, -10);
  ctx.lineTo(edge + Math.tan(a) * H, H + 10);
  ctx.lineTo(-10, H + 10);
  ctx.closePath();
  return edge;
}

/** Dessine `fn` uniquement dans la zone balayee par la lame. */
function clipDiagonal(prog, angle, fn) {
  layer(function () {
    diagonalPath(prog, angle, 0);
    ctx.clip();
    fn();
  });
}

/** Lame orange lumineuse qui balaie l'ecran. */
function wipeBlade(prog, angle, color, width) {
  if (prog <= 0.001 || prog >= 0.999) return;
  var a = angle === undefined ? -0.32 : angle;
  var span = W + Math.abs(Math.tan(a)) * H;
  var edge = -Math.abs(Math.tan(a)) * H + prog * span;
  var bw = width || 190;
  layer(function () {
    ctx.globalCompositeOperation = 'lighter';
    var g = ctx.createLinearGradient(edge - bw, 0, edge + bw * 0.22, 0);
    g.addColorStop(0, rgba(color || C.ORANGE, 0));
    g.addColorStop(0.72, rgba(color || C.ORANGE, 0.55));
    g.addColorStop(0.93, rgba(color || C.ORANGE, 0.95));
    g.addColorStop(1, rgba(color || C.ORANGE, 0));
    ctx.fillStyle = g;
    poly([
      [edge - bw * 1.1, -10], [edge + bw * 0.3, -10],
      [edge + bw * 0.3 + Math.tan(a) * H, H + 10], [edge - bw * 1.1 + Math.tan(a) * H, H + 10]
    ]);
    ctx.fill();
  });
}

/** Flash court (<= 6 frames conseille). */
function flash(prog, color, maxAlpha) {
  if (prog <= 0.001 || prog >= 0.999) return;
  var a = Math.sin(prog * Math.PI) * (maxAlpha === undefined ? 0.85 : maxAlpha);
  layer(function () {
    ctx.globalAlpha = a;
    ctx.fillStyle = color || C.WHITE;
    ctx.fillRect(0, 0, W, H);
  });
}

/** Revelation par disque. */
function maskCircle(prog, cx, cy, fn) {
  var r = easeInOutCubic(clamp01(prog)) * Math.hypot(W, H) * 0.62;
  layer(function () {
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.2832); ctx.clip();
    fn();
  });
}

/**
 * Portail d'ecran : le contenu du tampon hors-ecran est affiche dans `rect`
 * puis grandit jusqu'a remplir le cadre (zoom-into-screen).
 */
function screenPortal(prog, rect, alpha) {
  var k = easeInOutQuint(clamp01(prog));
  var x = lerp(rect.x, 0, k), y = lerp(rect.y, 0, k);
  var w = lerp(rect.w, W, k), h = lerp(rect.h, H, k);
  layer(function () {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.drawImage(OFF, x, y, w, h);
  });
}

/** Zoom punch + bloom : accentue une coupe. */
function zoomPunch(prog, cx, cy, amount) {
  if (prog <= 0.001 || prog >= 0.999) return;
  var k = Math.sin(prog * Math.PI);
  var s = 1 + (amount === undefined ? 0.12 : amount) * k;
  layer(function () {
    ctx.globalAlpha = 0.45 * k;
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
    ctx.drawImage(OFF, 0, 0);
  });
}

/** Balayage motion-blurré (3 strates d'alpha decalees). */
function whipPan(prog, dir, strength) {
  if (prog <= 0.001) return;
  var k = Math.sin(clamp01(prog) * Math.PI);
  var d = (dir || 1) * (strength || 170) * k;
  layer(function () {
    for (var i = 1; i <= 3; i++) {
      ctx.globalAlpha = 0.22 / i;
      ctx.drawImage(OFF, d * i * 0.42, 0);
    }
  });
}

/** Aspiration de l'image vers un point lumineux. */
function collapseToPoint(prog, cx, cy) {
  var k = easeInOutQuint(clamp01(prog));
  var s = lerp(1, 0.015, k);
  layer(function () {
    ctx.fillStyle = C.INK; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1 - k * 0.15;
    ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
    ctx.drawImage(OFF, 0, 0);
  });
  if (k > 0.45) {
    var b = clamp01((k - 0.45) / 0.55);
    glow(cx, cy, lerp(60, 520, b), C.ORANGE_LT, 0.55 * b);
    glow(cx, cy, lerp(20, 180, b), C.WHITE, 0.75 * b);
  }
}

/* ==========================================================================
 * MARQUE — Maison de l'Entreprise du Niger
 * L'asset officiel n'est JAMAIS redessine ni deforme : translation, echelle
 * uniforme et opacite uniquement (RULES.md §7).
 * ======================================================================== */

var LOGO = { img: null, ratio: 520 / 190, loaded: false, missing: true };

function loadLogo() {
  var candidates = ['assets/logo-men.svg', 'assets/logo-men.png', 'assets/logo-men.jpg', 'assets/logo-men.webp'];
  return new Promise(function (resolve) {
    var i = 0;
    function tryNext() {
      if (i >= candidates.length) {
        LOGO.loaded = true; LOGO.missing = true;
        console.warn('[JDE] logo officiel manquant — lockup typographique de substitution utilise. ' +
                     'Deposer assets/logo-men.svg pour le remplacer.');
        return resolve(false);
      }
      var src = candidates[i++];
      var im = new Image();
      im.onload = function () {
        if (!im.naturalWidth) return tryNext();
        LOGO.img = im;
        LOGO.ratio = im.naturalWidth / im.naturalHeight;
        LOGO.loaded = true; LOGO.missing = false;
        console.log('[JDE] logo officiel charge : ' + src);
        resolve(true);
      };
      im.onerror = tryNext;
      im.src = src;
    }
    tryNext();
  });
}

/**
 * Dessine la marque dans une boite (x,y = centre ; boxW,boxH = boite max).
 * Ratio preserve, inscription type « contain ».
 */
function logoMEN(x, y, boxW, boxH, prog, alpha) {
  var k = elasticSoft(clamp01(prog), 0.26);
  if (k <= 0.002) return;
  var a = (alpha === undefined ? 1 : alpha) * Math.min(1, clamp01(prog) * 1.6);
  if (LOGO.img) {
    var w = boxW, h = boxW / LOGO.ratio;
    if (h > boxH) { h = boxH; w = boxH * LOGO.ratio; }
    w *= lerp(0.84, 1, k); h *= lerp(0.84, 1, k);
    layer(function () {
      ctx.globalAlpha = a;
      ctx.drawImage(LOGO.img, x - w / 2, y - h / 2, w, h);
    });
  } else {
    LOGO_FALLBACK(x, y, boxW, boxH, k, a);
  }
}

/**
 * Lockup typographique institutionnel de substitution.
 * Utilise uniquement si l'asset officiel est absent.
 */
function LOGO_FALLBACK(x, y, boxW, boxH, k, a) {
  var s = boxW / 520;
  layer(function () {
    ctx.globalAlpha = a;
    ctx.translate(x, y);
    ctx.scale(s * lerp(0.86, 1, k), s * lerp(0.86, 1, k));
    // ecusson
    layer(function () {
      ctx.translate(-186, 0);
      softShadow('#000814', 34, 12, 0.5);
      var g = ctx.createLinearGradient(-62, -62, 62, 62);
      g.addColorStop(0, mixHex(C.BLUE, C.BLUE_LT, 0.30));
      g.addColorStop(1, C.BLUE);
      ctx.fillStyle = g;
      rr(-62, -62, 124, 124, 22); ctx.fill();
      noShadow();
      ctx.strokeStyle = rgba(C.ORANGE, 0.95); ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, 6, 46, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
      ctx.fillStyle = C.WHITE;
      ctx.font = FT.display(40, 900);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('MEN', 0, -10);
    });
    // raison sociale
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = C.WHITE;
    ctx.font = FT.display(34, 800);
    drawTracked('MAISON DE L’ENTREPRISE', -104, -10, 1.2, 'left');
    ctx.fillStyle = rgba(C.WHITE, 0.92);
    drawTracked('DU NIGER', -104, 34, 1.2, 'left');
    ctx.fillStyle = C.ORANGE;
    rr(-104, 48, 118, 5, 2.5); ctx.fill();
  });
}

/** Filet d'encadrement institutionnel qui se trace sur les quatre bords. */
function endCardFrame(prog, inset, color, alpha) {
  var p = easeInOutCubic(clamp01(prog));
  if (p <= 0.002) return;
  var m = inset || 54;
  var x0 = m, y0 = m, x1 = W - m, y1 = H - m;
  var per = (x1 - x0) * 2 + (y1 - y0) * 2;
  var drawn = per * p;
  var segs = [
    [x0, y0, x1, y0], [x1, y0, x1, y1], [x1, y1, x0, y1], [x0, y1, x0, y0]
  ];
  layer(function () {
    ctx.globalAlpha = alpha === undefined ? 0.5 : alpha;
    ctx.strokeStyle = color || rgba(C.BLUE_PALE, 0.55);
    ctx.lineWidth = 2;
    var acc = 0;
    for (var i = 0; i < 4; i++) {
      var sx = segs[i][0], sy = segs[i][1], ex = segs[i][2], ey = segs[i][3];
      var L = Math.hypot(ex - sx, ey - sy);
      if (acc >= drawn) break;
      var f = Math.min(1, (drawn - acc) / L);
      ctx.beginPath(); ctx.moveTo(sx, sy);
      ctx.lineTo(lerp(sx, ex, f), lerp(sy, ey, f)); ctx.stroke();
      acc += L;
    }
    // coins d'accent orange
    if (p > 0.92) {
      var ca = clamp01((p - 0.92) / 0.08);
      ctx.strokeStyle = rgba(C.ORANGE, 0.9 * ca); ctx.lineWidth = 4;
      var L2 = 46;
      ctx.beginPath();
      ctx.moveTo(x0, y0 + L2); ctx.lineTo(x0, y0); ctx.lineTo(x0 + L2, y0);
      ctx.moveTo(x1 - L2, y1); ctx.lineTo(x1, y1); ctx.lineTo(x1, y1 - L2);
      ctx.stroke();
    }
  });
}
