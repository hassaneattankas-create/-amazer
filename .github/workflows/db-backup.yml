name: Sauvegarde quotidienne de la base

# Neon gratuit ne permet de revenir en arriere que sur 6 h : cette copie
# quotidienne (format pg_dump compresse) est conservee 14 jours comme artefact.
# Restauration : voir docs/RESTAURATION_BASE.md.
#
# Adresse de la base : secret NEON_DATABASE_URL s'il existe, sinon lue a chaque
# passage dans la variable DATABASE_URL du serveur Render (secret RENDER_API_KEY,
# deja utilise pour les deploiements). Rien a recopier a la main.

on:
  schedule:
    - cron: "30 2 * * *" # 02:30 UTC chaque nuit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: pg_dump de la base de production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Recuperer l'adresse de la base
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-d6jcoqngi27c73d335i0
        run: |
          url="$NEON_DATABASE_URL"
          if [ -z "$url" ] && [ -n "$RENDER_API_KEY" ]; then
            api() { curl -sS --fail -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1$1"; }
            # 1) variables du service backend
            url=$(api "/services/$RENDER_SERVICE_ID/env-vars?limit=100" \
              | jq -r '.[] | (.envVar // .) | select(.key=="DATABASE_URL") | .value' | head -1)
            # 2) sinon, groupes de variables partages
            if [ -z "$url" ]; then
              for g in $(api "/env-groups?limit=100" | jq -r '.[] | (.envGroup // .) | .id'); do
                url=$(api "/env-groups/$g" | jq -r '.envVars[]? | select(.key=="DATABASE_URL") | .value' | head -1)
                [ -n "$url" ] && break
              done
            fi
          fi
          if [ -z "$url" ]; then
            echo "::error::Adresse de la base introuvable (ni secret NEON_DATABASE_URL, ni DATABASE_URL sur Render)."
            exit 1
          fi
          echo "::add-mask::$url"
          # pg_dump veut postgresql:// (pas le pilote SQLAlchemy) et une connexion
          # directe : le « pooler » de Neon ne supporte pas pg_dump.
          url=$(printf '%s' "$url" | sed -E 's#^postgres(ql)?\+[a-z0-9_]+://#postgresql://#; s#^postgres://#postgresql://#; s#-pooler\.#.#')
          echo "::add-mask::$url"
          echo "DB_URL=$url" >> "$GITHUB_ENV"
          echo "Adresse de la base recuperee."

      - name: Installer le client PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Exporter la base
        run: |
          STAMP=$(date -u +%Y-%m-%d_%H%M)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" \
            --format=custom --compress=9 --no-owner --no-privileges \
            --file="amazer_${STAMP}.dump"
          ls -lh "amazer_${STAMP}.dump"
          # Controle d'integrite : la liste des objets doit etre lisible.
          /usr/lib/postgresql/17/bin/pg_restore --list "amazer_${STAMP}.dump" | grep -c "TABLE DATA" \
            | xargs -I{} echo "Tables exportees : {}"

      - name: Conserver la sauvegarde (14 jours)
        uses: actions/upload-artifact@v4
        with:
          name: amazer-db-${{ env.STAMP }}
          path: amazer_${{ env.STAMP }}.dump
          retention-days: 14
          if-no-files-found: error
