name: Keep Backend Alive

on:
  schedule:
    # Toutes les 14 minutes, 24h/24, 7j/7 (< 15 min = Render reste eveille)
    - cron: "*/14 * * * *"
    # Reveil du matin (6 h a Niamey) : la nuit, le serveur ne se garde plus
    # eveille lui-meme (voir backend/app/services/keep_awake.py).
    - cron: "0 5 * * *"
    - cron: "20 5 * * *"
  workflow_dispatch: # Permet de lancer manuellement si besoin

jobs:
  ping:
    name: Ping Render backend
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping /ping
        run: |
          # `|| echo 000` : sous `bash -e`, un curl qui timeout (cold start Render)
          # ferait echouer l'etape avant le test. On capture toujours un statut.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 90 --retry 2 --retry-all-errors \
            "https://amazer-api.onrender.com/ping" || echo "000")
          echo "Status HTTP: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Backend ne repond pas (status $STATUS) — cold start probablement en cours, on reessaiera dans 14 min."
            exit 0
          fi
          echo "Backend actif."
