services:
  gateway:
    build: .
    env_file: .env
    restart: unless-stopped
  caddy:
    image: caddy:2.10-alpine
    depends_on:
      - gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
